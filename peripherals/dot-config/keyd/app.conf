# Per-application overrides applied by keyd-application-mapper.
# The default [spanish*] layers in /etc/keyd/default.conf inject keysyms with
# xdotool, which reaches applications that ignore XCompose. These applications
# handle the compose sequences themselves, so bind them to compose macros here.

[chromium]
# ` to test it works
spanish.d = `
spanish.a = macro(compose a ')
spanish.e = macro(compose e ')
spanish.i = macro(compose i ')
spanish.o = macro(compose o ')
spanish.u = macro(compose u ')
spanish.n = macro(compose n ~)
spanish+shift.a = macro(compose A ')
spanish+shift.e = macro(compose E ')
spanish+shift.i = macro(compose I ')
spanish+shift.o = macro(compose O ')
spanish+shift.u = macro(compose U ')
spanish+shift.n = macro(compose N ~)
spanish+shift.1 = macro(compose ! !)
spanish+shift.4 = macro(compose e =)
spanish+shift./ = macro(compose ? ?)
spanish_upper.a = macro(compose A ')
spanish_upper.e = macro(compose E ')
spanish_upper.i = macro(compose I ')
spanish_upper.o = macro(compose O ')
spanish_upper.u = macro(compose U ')
spanish_upper.n = macro(compose N ~)
spanish_upper.1 = macro(compose ! !)
spanish_upper.4 = macro(compose e =)
spanish_upper./ = macro(compose ? ?)

