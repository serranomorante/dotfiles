# Vim-style copy-mode scroll marks.
set-option -gF @dotfiles-tmux-copy-mark-command '#{d:current_file}/../../bin/tmux-copy-mark'

set-hook -g pane-mode-changed[90] 'if -F "#{&&:#{pane_in_mode},#{==:#{pane_mode},copy-mode}}" "run-shell -b \"#{@dotfiles-tmux-copy-mark-command} record-entry #{socket_path} #{hook_pane}\""'

bind-key 'I' run-shell -b '"#{@dotfiles-tmux-copy-mark-command}" restore-last "#{socket_path}" "#{pane_id}"'
bind-key 'g' run-shell -b '"#{@dotfiles-tmux-copy-mark-command}" picker "#{socket_path}" "#{pane_id}"'
bind-key "'" switch-client -T dotfiles-copy-mark-jump

bind-key -T copy-mode-vi 'i' run-shell -b '"#{@dotfiles-tmux-copy-mark-command}" save-last-and-cancel "#{socket_path}" "#{pane_id}"'
bind-key -T copy-mode-vi 'q' run-shell -b '"#{@dotfiles-tmux-copy-mark-command}" save-last-and-cancel "#{socket_path}" "#{pane_id}"'
bind-key -T copy-mode-vi 'm' switch-client -T dotfiles-copy-mark-save
bind-key -T copy-mode-vi "'" switch-client -T dotfiles-copy-mark-jump

bind-key -T dotfiles-copy-mark-save 'a' run-shell -b '"#{@dotfiles-tmux-copy-mark-command}" save-prompt "#{socket_path}" "#{pane_id}" a'
