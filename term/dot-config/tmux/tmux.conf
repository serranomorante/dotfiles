# vim-like copy keys
bind-key -T copy-mode-vi 'i' set-option -pF @dotfiles-copy-scroll-position '#{scroll_position}' \; set-option -pF @dotfiles-copy-position-limit '#{copy_position_limit}' \; set-option -pF @dotfiles-copy-cursor-x '#{copy_cursor_x}' \; set-option -pF @dotfiles-copy-cursor-y '#{copy_cursor_y}' \; send-keys -X cancel
bind-key -T copy-mode-vi 'q' set-option -pF @dotfiles-copy-scroll-position '#{scroll_position}' \; set-option -pF @dotfiles-copy-position-limit '#{copy_position_limit}' \; set-option -pF @dotfiles-copy-cursor-x '#{copy_cursor_x}' \; set-option -pF @dotfiles-copy-cursor-y '#{copy_cursor_y}' \; send-keys -X cancel
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi '_' send-keys -X back-to-indentation
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-no-clear 'xclip -in -selection clipboard'
bind-key 'I' run-shell 'tmux="tmux -S #{socket_path}"; pane="#{pane_id}"; $tmux copy-mode -t "$pane"; saved_scroll=$($tmux display-message -p -t "$pane" "##{@dotfiles-copy-scroll-position}"); saved_limit=$($tmux display-message -p -t "$pane" "##{@dotfiles-copy-position-limit}"); saved_x=$($tmux display-message -p -t "$pane" "##{@dotfiles-copy-cursor-x}"); saved_y=$($tmux display-message -p -t "$pane" "##{@dotfiles-copy-cursor-y}"); current_limit=$($tmux display-message -p -t "$pane" "##{copy_position_limit}"); saved_scroll=${saved_scroll:-0}; saved_limit=${saved_limit:-$current_limit}; saved_x=${saved_x:-0}; saved_y=${saved_y:-0}; restore=$((saved_scroll + current_limit - saved_limit)); [ "$restore" -lt 0 ] && restore=0; $tmux send-keys -t "$pane" -X goto-line "$restore"; $tmux send-keys -t "$pane" -X top-line; i=0; while [ "$i" -lt "$saved_y" ]; do $tmux send-keys -t "$pane" -X cursor-down; i=$((i + 1)); done; $tmux send-keys -t "$pane" -X start-of-line; i=0; while [ "$i" -lt "$saved_x" ]; do $tmux send-keys -t "$pane" -X cursor-right; i=$((i + 1)); done'

set-option -g allow-passthrough on
set-option -g visual-activity off

# use ctrl+s as prefix
unbind C-b
set-option -g prefix C-s
bind-key 'C-s' send-prefix

# vi key bindings
# https://github.com/tmux/tmux/wiki/Getting-Started#vi1-key-bindings
set-option -g mode-keys vi
set-option -g status-keys vi

# https://stackoverflow.com/a/72548456
set-option -g status-left-length 9999

# autocmd support for FocusLost/FocusGained
set-option -g focus-events on

# to copy with the mouse
set-option -g mouse on

# Fix slow escape
# https://github.com/fish-shell/fish-shell/issues/5894#issuecomment-496329983
set-option -sg escape-time 0

# Set scrollback
# https://stackoverflow.com/a/18777877
set-option -g history-limit 250000

# Use vim navigation keys to move between panes
bind-key 'h' select-pane -L
bind-key 'j' select-pane -D
bind-key 'k' select-pane -U
bind-key 'l' select-pane -R

# Switch to last window
bind-key 'w' last-window

# https://github.com/ivnvxd/tmux-snazzy
source-file ~/.config/tmux/themes/snazzy.tmux

# https://github.com/ThePrimeagen/.dotfiles/blob/master/tmux/.tmux.conf
bind-key 'f' run-shell "tmux neww ~/.config/tmux/scripts/tmux-sessionizer"
## BEGIN ANSIBLE MANAGED BLOCK - SETUP TMUX.CONF
set-option -g default-shell /usr/bin/bash
set-option -g default-terminal "xterm-kitty"
set-option -ag terminal-overrides ",xterm-kitty:RGB"
## END ANSIBLE MANAGED BLOCK - SETUP TMUX.CONF

# Use current directory when creating new panes and windows
bind-key 'c' new-window -c "#{pane_current_path}"
bind-key '"' split-window -c "#{pane_current_path}"
bind-key '%' split-window -h -c "#{pane_current_path}"

# don't rename windows automatically
set-option -g allow-rename off

bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1
