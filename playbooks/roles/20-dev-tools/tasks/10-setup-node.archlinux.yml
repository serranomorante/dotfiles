---
- name: "[{{ user_os }}] Setup node: ensure user bin directory"
  ansible.builtin.file:
    path: "{{ node_user_bin_dir }}"
    state: directory
    mode: "755"

- name: "[{{ user_os }}] Setup node: ensure firejail profile directory"
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.config/firejail"
    state: directory
    mode: "755"

- name: "[{{ user_os }}] Setup node: ensure AI agent Stow target include fallback"
  ansible.builtin.copy:
    dest: "{{ ansible_facts.env.HOME }}/.config/firejail/ai-agent-stow-targets.inc"
    content: |
      # Generated by dotfiles-ai-agent-stow-targets.
      # Empty fallback; run dotfiles-stow to refresh active Stow targets.
    mode: "644"
    force: false

- name: "[{{ user_os }}] Setup node: install firejail profiles"
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ ansible_facts.env.HOME }}/.config/firejail/{{ item }}"
    mode: "644"
  loop:
    - dev-tools-common.inc
    - dev-editor-shell-common.inc
    - ai-agent-common.inc
    - claude.profile
    - codex.profile
    - gemini.profile
    - opencode.profile
    - fj-node.profile
    - fj-node-ansible.profile
    - fj-node-volta-bootstrap.profile
    - fj-node-mcp.profile
    - fj-node-hypothesis.profile

- name: "[{{ user_os }}] Setup node: ensure AI agent profile checker snapshot directory"
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.local/share/firejail-wrapper/ai-agent-profiles"
    state: directory
    mode: "755"

- name: "[{{ user_os }}] Setup node: ensure AI agent Stow target snapshot fallback"
  ansible.builtin.copy:
    dest: "{{ ansible_facts.env.HOME }}/.local/share/firejail-wrapper/ai-agent-profiles/ai-agent-stow-targets.inc"
    content: |
      # Generated by dotfiles-ai-agent-stow-targets.
      # Empty fallback; run dotfiles-stow to refresh active Stow targets.
    mode: "644"
    force: false

- name: "[{{ user_os }}] Setup node: install AI agent profile checker snapshots"
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ ansible_facts.env.HOME }}/.local/share/firejail-wrapper/ai-agent-profiles/{{ item }}"
    mode: "644"
  loop:
    - dev-tools-common.inc
    - ai-agent-common.inc
    - claude.profile
    - codex.profile
    - gemini.profile
    - opencode.profile

- name: "[{{ user_os }}] Setup node: stat AI agent Stow target generator"
  ansible.builtin.stat:
    path: "{{ node_user_bin_dir }}/dotfiles-ai-agent-stow-targets"
  register: var_ai_agent_stow_targets_generator

- name: "[{{ user_os }}] Setup node: refresh AI agent Stow target includes"
  ansible.builtin.command:
    argv:
      - "{{ node_user_bin_dir }}/dotfiles-ai-agent-stow-targets"
  register: var_ai_agent_stow_targets_refresh
  changed_when: "'updated ' in var_ai_agent_stow_targets_refresh.stdout"
  when: var_ai_agent_stow_targets_generator.stat.exists

- name: "[{{ user_os }}] Setup node: install firejail wrapper helper"
  ansible.builtin.copy:
    src: firejail-wrapper-common.bash
    dest: "{{ node_user_bin_dir }}/firejail-wrapper-common.bash"
    mode: "755"

- name: "[{{ user_os }}] Setup node: install firejail profile checker"
  ansible.builtin.copy:
    src: fj-profile-checker
    dest: "{{ node_user_bin_dir }}/fj-profile-checker"
    mode: "755"

- name: "[{{ user_os }}] Setup node: ensure volta home exists"
  ansible.builtin.file:
    path: "{{ node_volta_home }}"
    state: directory
    mode: "755"

- name: "[{{ user_os }}] Setup node: ensure scoped node wrapper state dirs"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "755"
  loop:
    - "{{ ansible_facts.env.HOME }}/.cache/firejail-wrapper/node"
    - "{{ ansible_facts.env.HOME }}/.local/state/firejail-wrapper/node"
    - "{{ ansible_facts.env.HOME }}/.local/share/firejail-wrapper/node"

- name: "[{{ user_os }}] Setup node: ensure volta tool project dir"
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/data/apps/dev-tools/volta-tools"
    state: directory
    mode: "755"

- name: "[{{ user_os }}] Setup node: stat volta marker"
  ansible.builtin.include_role:
    name: dotfiles-markers
    tasks_from: check
  vars:
    dotfiles_marker_name: "volta-{{ volta_version }}"
    dotfiles_marker_register: var_volta_marker

- name: "[{{ user_os }}] Setup node: install volta"
  ansible.builtin.command:
    argv:
      - /usr/bin/firejail
      - "--profile={{ ansible_facts.env.HOME }}/.config/firejail/fj-node-volta-bootstrap.profile"
      - --protocol=unix,inet,inet6,netlink
      - /usr/bin/env
      - -i
      - "HOME={{ ansible_facts.env.HOME }}"
      - "PATH={{ ansible_facts.env.PATH }}"
      - "XDG_CACHE_HOME={{ ansible_facts.env.HOME }}/.cache/firejail-wrapper/node"
      - "XDG_STATE_HOME={{ ansible_facts.env.HOME }}/.local/state/firejail-wrapper/node"
      - bash
      - -lc
      - "set -o pipefail && curl https://get.volta.sh | bash -s -- --skip-setup --version {{ volta_version }}"
  changed_when: true
  when: not var_volta_marker.stat.exists

- name: "[{{ user_os }}] Setup node: record volta marker"
  ansible.builtin.include_role:
    name: dotfiles-markers
    tasks_from: record
  vars:
    dotfiles_marker_name: "volta-{{ volta_version }}"
    dotfiles_marker_content: "{{ volta_version }}\n"
  when: not var_volta_marker.stat.exists

- name: "[{{ user_os }}] Setup node: install generic firejail node wrapper"
  ansible.builtin.copy:
    src: fj-node
    dest: "{{ node_firejail_executable }}"
    mode: "755"

- name: "[{{ user_os }}] Setup node: install MCP inherited sandbox wrapper"
  ansible.builtin.copy:
    src: fj-mcp-inherit
    dest: "{{ node_user_bin_dir }}/fj-mcp-inherit"
    mode: "755"

- name: "[{{ user_os }}] Setup node: install AI agent firejail wrapper"
  ansible.builtin.copy:
    src: fj-ai-agent
    dest: "{{ node_user_bin_dir }}/{{ item }}"
    mode: "755"
  loop:
    - fj-claude
    - fj-codex
    - fj-gemini
    - fj-opencode

- name: "[{{ user_os }}] Setup node: install OpenCode mini readability wrapper"
  ansible.builtin.copy:
    src: opencode-mini-readable
    dest: "{{ node_user_bin_dir }}/opencode-mini-readable"
    mode: "755"

- name: "[{{ user_os }}] Setup node: install ansible firejail npm wrapper"
  ansible.builtin.copy:
    src: ansible-firejail-npm
    dest: "{{ ansible_firejail_npm_executable }}"
    mode: "755"

- name: "[{{ user_os }}] Setup node: install ansible firejail pnpm wrapper"
  ansible.builtin.copy:
    src: ansible-firejail-pnpm
    dest: "{{ ansible_firejail_pnpm_executable }}"
    mode: "755"

- name: "[{{ user_os }}] Setup node: add volta to shared session environment"
  ansible.builtin.blockinfile:
    dest: ~/dotfiles/home/lib/session-env.bash
    create: true
    marker: "## {mark} ANSIBLE MANAGED BLOCK - SETUP NODE"
    mode: "744"
    block: |
      export VOLTA_HOME="$HOME/.volta"
      dotfiles_path_prepend "$VOLTA_HOME/bin"
      dotfiles_path_prepend "$VOLTA_HOME/tools/image/node/{{ node_system_default_version }}/bin" # version is replaced by ansible

- name: "[{{ user_os }}] Setup node: install node versions"
  ansible.builtin.command:
    argv:
      - "{{ node_firejail_executable }}"
      - online
      - "{{ ansible_facts.env.HOME }}/data/apps/dev-tools/volta-tools"
      - --
      - "{{ ansible_facts.env.HOME }}/.volta/bin/volta"
      - install
      - "node@{{ item }}"
  environment:
    FJ_NODE_WRITABLE_PATHS: |
      {{ ansible_facts.env.HOME }}/.volta
  args:
    creates: "{{ node_volta_home }}/tools/image/node/{{ item }}/bin/node"
  loop: "{{ node_managed_versions | unique }}"
  changed_when: true

- name: "[{{ user_os }}] Setup node: reset package manager marker specs"
  ansible.builtin.set_fact:
    var_node_package_manager_marker_specs: []

- name: "[{{ user_os }}] Setup node: build package manager marker specs"
  ansible.builtin.set_fact:
    var_node_package_manager_marker_specs: "{{ var_node_package_manager_marker_specs + [var_node_package_manager_marker_spec] }}"
  vars:
    var_node_package_manager_marker_spec:
      name: "volta-package-{{ item.name }}-{{ item.version }}"
      item: "{{ item }}"
  loop: "{{ node_package_manager_packages }}"

- name: "[{{ user_os }}] Setup node: stat package manager markers"
  ansible.builtin.include_role:
    name: dotfiles-markers
    tasks_from: check-many
  vars:
    dotfiles_marker_register: var_node_package_manager_markers
    dotfiles_marker_items: "{{ var_node_package_manager_marker_specs | default([]) }}"

- name: "[{{ user_os }}] Setup node: ensure package managers"
  ansible.builtin.command:
    argv:
      - "{{ node_firejail_executable }}"
      - online
      - "{{ ansible_facts.env.HOME }}/data/apps/dev-tools/volta-tools"
      - --
      - "{{ ansible_facts.env.HOME }}/.volta/bin/volta"
      - install
      - "{{ item.name }}@{{ item.version }}"
  environment:
    FJ_NODE_WRITABLE_PATHS: |
      {{ ansible_facts.env.HOME }}/.volta
  loop: "{{ node_package_manager_packages }}"
  changed_when: true
  when: not var_node_package_manager_markers.results[ansible_loop.index0].stat.exists
  loop_control:
    extended: true
  register: var_node_package_manager_install

- name: "[{{ user_os }}] Setup node: record package manager markers"
  ansible.builtin.include_role:
    name: dotfiles-markers
    tasks_from: record
  vars:
    dotfiles_marker_name: "volta-package-{{ item.item.name }}-{{ item.item.version }}"
    dotfiles_marker_content: "{{ item.item.name }}@{{ item.item.version }}\n"
  loop: "{{ var_node_package_manager_install.results }}"
  when: item.changed | default(false)

- name: "[{{ user_os }}] Setup node: symlink package manager binaries"
  ansible.builtin.file:
    src: "{{ node_volta_home }}/bin/{{ item.1 }}"
    dest: "{{ node_user_bin_dir }}/{{ item.1 }}"
    state: link
  loop: "{{ node_package_manager_packages | subelements('bins') }}"
