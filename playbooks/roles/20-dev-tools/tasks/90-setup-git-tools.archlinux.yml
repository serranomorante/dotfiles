---
- name: "[{{ user_os }}] Git tools: ensure diff tools"
  become: true
  ansible.builtin.package:
    state: present
    name:
      - difftastic
      - git-delta

- name: "[{{ user_os }}] Git tools: remove stable lazygit package"
  become: true
  ansible.builtin.package:
    state: absent
    name: lazygit

- name: "[{{ user_os }}] Git tools: ensure lazygit from master"
  ansible.builtin.include_tasks: "{{ ansible_facts.env.HOME }}/dotfiles/playbooks/roles/10-system-tools/tasks/install-local-aur-packages.archlinux.yml"
  vars:
    aur_local_packages: lazygit-git
