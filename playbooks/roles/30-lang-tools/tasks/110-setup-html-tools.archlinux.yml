---
- name: "[{{ user_os }}] HTML language: ensure npm packages with diff capture"
  ansible.builtin.include_role:
    name: update-diff-capture
    tasks_from: npm
  vars:
    update_diff_capture_scope: html-language
    update_diff_npm_prefix: "{{ node_html_npm_prefix }}"
    update_diff_npm_packages: "{{ node_html_npm_packages }}"
    update_diff_npm_node_version: "{{ node_system_default_version }}"
    update_diff_npm_executable: "{{ ansible_firejail_npm_executable }}"

- name: "[{{ user_os }}] HTML language: symlink npm binaries"
  ansible.builtin.file:
    src: "{{ node_html_npm_prefix }}/bin/{{ item.1 }}"
    dest: "{{ node_user_bin_dir }}/{{ item.1 }}"
    state: link
  loop: "{{ node_html_npm_packages | subelements('bins') }}"

- name: "[{{ user_os }}] HTML language: ensure superhtml download directory"
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/data/apps/lang-tools/superhtml"
    state: directory
    mode: "755"

- name: "[{{ user_os }}] HTML language: stat superhtml marker"
  ansible.builtin.include_role:
    name: dotfiles-markers
    tasks_from: check
  vars:
    dotfiles_marker_name: "superhtml-{{ arch_superhtml_version }}"
    dotfiles_marker_register: var_superhtml_marker

- name: "[{{ user_os }}] HTML language: download superhtml"
  ansible.builtin.command:
    argv:
      - "{{ python_firejail_executable }}"
      - online
      - "{{ ansible_facts.env.HOME }}/data/apps/lang-tools/superhtml"
      - --
      - curl
      - -L
      - -o
      - "{{ ansible_facts.env.HOME }}/data/apps/lang-tools/superhtml/superhtml-{{ arch_superhtml_version }}.tar.gz"
      - "https://github.com/kristoff-it/superhtml/releases/download/v{{ arch_superhtml_version }}/x86_64-linux-musl.tar.gz"
  environment:
    FJ_PY_WRITABLE_PATHS: |
      {{ ansible_facts.env.HOME }}/data/apps/lang-tools/superhtml
  args:
    creates: "{{ ansible_facts.env.HOME }}/data/apps/lang-tools/superhtml/superhtml-{{ arch_superhtml_version }}.tar.gz"
  when: not var_superhtml_marker.stat.exists

- name: "[{{ user_os }}] HTML language: install superhtml"
  ansible.builtin.command:
    argv:
      - "{{ python_firejail_executable }}"
      - offline
      - "{{ ansible_facts.env.HOME }}/data/apps/lang-tools/superhtml"
      - --
      - bsdtar
      - -xf
      - "{{ ansible_facts.env.HOME }}/data/apps/lang-tools/superhtml/superhtml-{{ arch_superhtml_version }}.tar.gz"
      - -C
      - "{{ ansible_facts.env.HOME }}/bin"
      - --strip-components=2
  environment:
    FJ_PY_WRITABLE_PATHS: |
      {{ ansible_facts.env.HOME }}/bin
      {{ ansible_facts.env.HOME }}/data/apps/lang-tools/superhtml
  when: not var_superhtml_marker.stat.exists
  changed_when: true

- name: "[{{ user_os }}] HTML language: record superhtml marker"
  ansible.builtin.include_role:
    name: dotfiles-markers
    tasks_from: record
  vars:
    dotfiles_marker_name: "superhtml-{{ arch_superhtml_version }}"
    dotfiles_marker_content: "{{ arch_superhtml_version }}\n"
  when: not var_superhtml_marker.stat.exists
