---
- name: "[{{ user_os }}] Vim language: ensure npm packages with diff capture"
  ansible.builtin.include_role:
    name: update-diff-capture
    tasks_from: npm
  vars:
    update_diff_capture_scope: vim-language
    update_diff_npm_prefix: "{{ node_vim_npm_prefix }}"
    update_diff_npm_packages: "{{ node_vim_npm_packages }}"
    update_diff_npm_node_version: "{{ node_system_default_version }}"
    update_diff_npm_executable: "{{ ansible_firejail_npm_executable }}"

- name: "[{{ user_os }}] Vim language: symlink npm binaries"
  ansible.builtin.file:
    src: "{{ node_vim_npm_prefix }}/bin/{{ item.1 }}"
    dest: "{{ node_user_bin_dir }}/{{ item.1 }}"
    state: link
  loop: "{{ node_vim_npm_packages | subelements('bins') }}"
