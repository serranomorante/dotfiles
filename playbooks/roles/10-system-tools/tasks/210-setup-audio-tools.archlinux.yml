---
- name: "[{{ user_os }}] Setup audio tools: ensure no package conflicts"
  become: true
  ansible.builtin.package:
    state: absent
    name:
      - plasma-pa
      - pulseaudio

- name: "[{{ user_os }}] Setup audio tools: install plexamp"
  community.general.flatpak:
    name: com.plexamp.Plexamp
    state: latest
  ignore_errors: true

- name: "[{{ user_os }}] Setup audio tools: check plexamp desktop file"
  ansible.builtin.stat:
    path: /var/lib/flatpak/exports/share/applications/com.plexamp.Plexamp.desktop
  register: var_plexamp_desktop_file

- name: "[{{ user_os }}] Setup audio tools: copy plexamp desktop file to user directory"
  ansible.builtin.copy:
    src: /var/lib/flatpak/exports/share/applications/com.plexamp.Plexamp.desktop
    dest: ~/.local/share/applications/com.plexamp.Plexamp.desktop
    mode: "644"
  when: var_plexamp_desktop_file.stat.exists

- name: "[{{ user_os }}] Setup audio tools: clean plexamp exec line"
  ansible.builtin.lineinfile:
    dest: ~/.local/share/applications/com.plexamp.Plexamp.desktop
    regexp: "^Exec=.*"
    state: absent
  when: var_plexamp_desktop_file.stat.exists

- name: "[{{ user_os }}] Setup audio tools: ensure plexamp resource-limited desktop"
  ansible.builtin.blockinfile:
    dest: ~/.local/share/applications/com.plexamp.Plexamp.desktop
    marker: "# {mark} ANSIBLE MANAGED BLOCK"
    insertafter: "^\\[Desktop Entry\\]"
    block: Exec={{ ansible_facts.env.HOME }}/bin/app-cgroup-launch plexamp /usr/bin/flatpak run --branch=stable --arch=x86_64 --command=startplexamp
      --file-forwarding com.plexamp.Plexamp @@u %U @@
  when: var_plexamp_desktop_file.stat.exists
  notify: handler_update_desktop_database

- name: "[{{ user_os }}] Setup audio tools: ensure local AUR packages"
  ansible.builtin.include_tasks: "{{ ansible_facts.env.HOME }}/dotfiles/playbooks/roles/10-system-tools/tasks/install-local-aur-packages.archlinux.yml"
  vars:
    aur_local_packages:
      - patchance-git
      - nerd-dictation-git
      - rtcqs

- name: "[{{ user_os }}] Setup audio tools: remove conflicting packages"
  become: true
  ansible.builtin.package:
    force: true
    state: absent
    name:
      - jack
      - jack2

- name: "[{{ user_os }}] Setup audio tools: ensure packages"
  become: true
  ansible.builtin.package:
    state: present
    name:
      - pipewire
      - lib32-pipewire
      - pipewire-docs
      - pipewire-audio
      - pipewire-alsa
      - pipewire-pulse
      - pipewire-jack
      - lib32-pipewire-jack
      - wireplumber
      - plasma-pa
      - speech-dispatcher
      - espeak-ng
      - python-vosk
      - unzip
      - realtime-privileges
      - base-devel
      - cpupower
      - helvum
      - alsa-utils
      - alsa-scarlett-gui
      - python-qtpy
      - rtirq
      - reaper
      - libebur128
      - ladspa
  notify: handler_ensure_rtirq_service

- name: "[{{ user_os }}] Setup audio tools: stat agc_ceiling plugin source"
  ansible.builtin.stat:
    path: "{{ role_path }}/files/ladspa-agc-ceiling.c"
  register: var_agc_ceiling_source

- name: "[{{ user_os }}] Setup audio tools: stat agc_ceiling plugin binary"
  ansible.builtin.stat:
    path: /usr/lib/ladspa/libdotfiles-agc-ceiling.so
  register: var_agc_ceiling_plugin

- name: "[{{ user_os }}] Setup audio tools: build agc_ceiling LADSPA plugin"
  become: true
  ansible.builtin.command:
    argv:
      - /usr/bin/gcc
      - -O2
      - -shared
      - -fPIC
      - -Wall
      - -Wextra
      - -Werror
      - "{{ role_path }}/files/ladspa-agc-ceiling.c"
      - -o
      - /usr/lib/ladspa/libdotfiles-agc-ceiling.so
      - -lebur128
      - -lm
  when:
    - var_agc_ceiling_source.stat.exists
    - not var_agc_ceiling_plugin.stat.exists or var_agc_ceiling_source.stat.mtime > var_agc_ceiling_plugin.stat.mtime
  # PipeWire keeps the previous .so mapped until the service restarts, so a
  # rebuilt plugin never reaches the running graph on its own. This is a
  # loudness-limiting plugin: a fix that stays on disk is a fix that is not
  # applied.
  notify:
    - handler_restart_pipewire
    - handler_restart_pipewire_pulse

- name: "[{{ user_os }}] Setup audio tools: mask global ALSA state services"
  become: true
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: true
    state: stopped
  loop:
    - alsa-state.service
    - alsa-restore.service

- name: "[{{ user_os }}] Setup audio tools: remove global ALSA state file"
  become: true
  ansible.builtin.file:
    path: /var/lib/alsa/asound.state
    state: absent

- name: "[{{ user_os }}] Setup audio tools: prioritize USB IRQ handlers"
  become: true
  ansible.builtin.lineinfile:
    path: /etc/rtirq.conf
    regexp: "^RTIRQ_NAME_LIST="
    line: 'RTIRQ_NAME_LIST="usb snd i8042"'
  notify: handler_restart_rtirq_service

- name: "[{{ user_os }}] Setup audio tools: ensure STT Vosk model directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "755"
  loop: >-
    {{
      (
        (arch_stt_vosk_models | map(attribute='archive_path') | map('dirname') | list)
        + (arch_stt_vosk_models | map(attribute='parent_dir') | list)
        + [arch_stt_dictation_project_path]
      ) | unique
    }}

- name: "[{{ user_os }}] Setup audio tools: download STT Vosk model"
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ item.archive_path | dirname }}/{{ item.url | basename | regex_replace('\\.zip$', '') }}-{{ item.url | hash('sha256') }}.zip"
    checksum: "{{ item.checksum | default(omit) }}"
    mode: "644"
    timeout: 300
  loop: "{{ arch_stt_vosk_models }}"

- name: "[{{ user_os }}] Setup audio tools: reset STT Vosk model marker specs"
  ansible.builtin.set_fact:
    var_arch_stt_vosk_model_marker_specs: []

- name: "[{{ user_os }}] Setup audio tools: build STT Vosk model marker specs"
  ansible.builtin.set_fact:
    var_arch_stt_vosk_model_marker_specs: "{{ var_arch_stt_vosk_model_marker_specs + [var_arch_stt_vosk_model_marker_spec] }}"
  vars:
    var_arch_stt_vosk_model_marker_spec:
      name: "vosk-model-{{ item.name }}-{{ item.url | hash('sha256') }}"
      item: "{{ item }}"
  loop: "{{ arch_stt_vosk_models }}"

- name: "[{{ user_os }}] Setup audio tools: stat STT Vosk model markers"
  ansible.builtin.include_role:
    name: dotfiles-markers
    tasks_from: check-many
  vars:
    dotfiles_marker_register: var_arch_stt_vosk_model_markers
    dotfiles_marker_items: "{{ var_arch_stt_vosk_model_marker_specs }}"

- name: "[{{ user_os }}] Setup audio tools: unpack STT Vosk model"
  ansible.builtin.unarchive:
    src: "{{ item.item.archive_path | dirname }}/{{ item.item.url | basename | regex_replace('\\.zip$', '') }}-{{ item.item.url | hash('sha256') }}.zip"
    dest: "{{ item.item.parent_dir }}"
    remote_src: true
  loop: "{{ var_arch_stt_vosk_model_markers.results }}"
  when: not item.stat.exists

- name: "[{{ user_os }}] Setup audio tools: record STT Vosk model marker"
  ansible.builtin.include_role:
    name: dotfiles-markers
    tasks_from: record
  vars:
    dotfiles_marker_name: "vosk-model-{{ item.item.name }}-{{ item.item.url | hash('sha256') }}"
    dotfiles_marker_content: "{{ item.item.url }}\n"
  loop: "{{ var_arch_stt_vosk_model_markers.results }}"
  when: not item.stat.exists

- name: "[{{ user_os }}] Setup audio tools: setup reaper-linux.desktop file"
  ansible.builtin.template:
    src: "{{ item }}"
    dest: ~/.local/share/applications/
    mode: "644"
  loop:
    - reaper-linux.desktop
    - reaper-linux-firejail.desktop
    - reaper-linux-legacy.desktop
    - reaper-linux-legacy-firejail.desktop
  notify: handler_update_desktop_database

- name: "[{{ user_os }}] Setup audio tools: setup launch-reaper-linux file"
  ansible.builtin.template:
    src: launch-reaper-linux
    dest: ~/.local/bin/launch-reaper-linux
    mode: "755"

- name: "[{{ user_os }}] Setup audio tools: setup ardour low-latency desktop file"
  ansible.builtin.template:
    src: ardour-low-latency.desktop
    dest: ~/.local/share/applications/
    mode: "644"
  notify: handler_update_desktop_database

- name: "[{{ user_os }}] Setup audio tools: setup launch-ardour file"
  ansible.builtin.template:
    src: launch-ardour
    dest: ~/.local/bin/launch-ardour
    mode: "755"

- name: "[{{ user_os }}] Setup audio tools: setup bitwig low-latency desktop file"
  ansible.builtin.template:
    src: com.bitwig.BitwigStudio.desktop
    dest: ~/.local/share/applications/com.bitwig.BitwigStudio.desktop
    mode: "644"
  notify: handler_update_desktop_database

- name: "[{{ user_os }}] Setup audio tools: setup launch-bitwig file"
  ansible.builtin.template:
    src: launch-bitwig
    dest: ~/.local/bin/launch-bitwig
    mode: "755"

# Studio One 7 (PreSonus native Linux DAW). The install recipe is pinned in
# files/studio-one-7/PKGBUILD (a mirror of the AUR package); the ~280 MB
# upstream .deb is downloaded once from my.presonus.com and kept under the
# read-only external-libraries share (arch_studio_one_deb_path) so the binary
# never enters the repo. The build happens in a writable local copy under
# arch_studio_one_build_dir because makepkg needs to write beside the source.
# Personal prefs (~/.config/PreSonus) and user projects (~/Studio One) are
# intentionally not managed here. The binary links libsdbus-c++.so.1 (sdbus-c++
# 1.x); the sdbus-cpp1 compat mirror (files/sdbus-cpp1) is built below whenever
# it is missing so the installed app can actually start.

- name: "[{{ user_os }}] Setup audio tools: studio one: stat external deb"
  ansible.builtin.stat:
    path: "{{ arch_studio_one_deb_path }}"
  register: var_studio_one_external_deb

- name: "[{{ user_os }}] Setup audio tools: studio one: get installed version"
  ansible.builtin.command: pacman -Q studio-one-7
  changed_when: false
  failed_when: false
  register: var_pacman_studio_one

- name: "[{{ user_os }}] Setup audio tools: studio one: set installed fact"
  ansible.builtin.set_fact:
    var_studio_one_installed: >-
      {{
        var_pacman_studio_one.rc == 0 and
        (var_pacman_studio_one.stdout.split() | length) > 1 and
        var_pacman_studio_one.stdout.split()[1].split('-')[0] == arch_studio_one_version
      }}

- name: "[{{ user_os }}] Setup audio tools: studio one: sdbus-cpp1: get installed version"
  ansible.builtin.command: pacman -Q sdbus-cpp1
  changed_when: false
  failed_when: false
  register: var_pacman_sdbus_cpp1

- name: "[{{ user_os }}] Setup audio tools: studio one: sdbus-cpp1: set installed fact"
  ansible.builtin.set_fact:
    var_sdbus_cpp1_installed: "{{ var_pacman_sdbus_cpp1.rc == 0 }}"

- name: "[{{ user_os }}] Setup audio tools: studio one: sdbus-cpp1: ensure build directory"
  ansible.builtin.file:
    path: "{{ arch_sdbus_cpp1_build_dir }}"
    state: directory
    mode: "755"
  when:
    - not var_sdbus_cpp1_installed
    - var_studio_one_external_deb.stat.exists or var_pacman_studio_one.rc == 0

- name: "[{{ user_os }}] Setup audio tools: studio one: sdbus-cpp1: copy pinned PKGBUILD"
  ansible.builtin.copy:
    src: "{{ role_path }}/files/sdbus-cpp1/PKGBUILD"
    dest: "{{ arch_sdbus_cpp1_build_dir }}/PKGBUILD"
    mode: "644"
  when:
    - not var_sdbus_cpp1_installed
    - var_studio_one_external_deb.stat.exists or var_pacman_studio_one.rc == 0

- name: "[{{ user_os }}] Setup audio tools: studio one: sdbus-cpp1: ensure build dependencies"
  become: true
  ansible.builtin.package:
    state: present
    name:
      - cmake
      - doxygen
      - systemd
      - expat
      - systemd-libs
  when:
    - not var_sdbus_cpp1_installed
    - var_studio_one_external_deb.stat.exists or var_pacman_studio_one.rc == 0

- name: "[{{ user_os }}] Setup audio tools: studio one: sdbus-cpp1: build package"
  ansible.builtin.command:
    argv:
      - makepkg
      - -C
      - -c
      - -f
      - --noconfirm
  args:
    chdir: "{{ arch_sdbus_cpp1_build_dir }}"
  changed_when: true
  timeout: 0
  when:
    - not var_sdbus_cpp1_installed
    - var_studio_one_external_deb.stat.exists or var_pacman_studio_one.rc == 0

- name: "[{{ user_os }}] Setup audio tools: studio one: sdbus-cpp1: locate built package"
  ansible.builtin.find:
    paths: "{{ arch_sdbus_cpp1_build_dir }}"
    patterns: "sdbus-cpp1-*.pkg.tar*"
    file_type: file
  register: var_sdbus_cpp1_built_package
  when:
    - not var_sdbus_cpp1_installed
    - var_studio_one_external_deb.stat.exists or var_pacman_studio_one.rc == 0

- name: "[{{ user_os }}] Setup audio tools: studio one: sdbus-cpp1: install package"
  become: true
  ansible.builtin.command:
    argv:
      - pacman
      - -U
      - --needed
      - --noconfirm
      - "{{ var_sdbus_cpp1_built_package.files[0].path }}"
  changed_when: true
  timeout: 0
  when:
    - not var_sdbus_cpp1_installed
    - var_studio_one_external_deb.stat.exists or var_pacman_studio_one.rc == 0
    - (var_sdbus_cpp1_built_package.files | default([]) | length) > 0

- name: "[{{ user_os }}] Setup audio tools: studio one: ensure build directory"
  ansible.builtin.file:
    path: "{{ arch_studio_one_build_dir }}"
    state: directory
    mode: "755"

- name: "[{{ user_os }}] Setup audio tools: studio one: symlink external deb into build directory"
  ansible.builtin.file:
    path: "{{ arch_studio_one_build_dir }}/{{ arch_studio_one_deb_name }}"
    src: "{{ arch_studio_one_deb_path }}"
    state: link
  when:
    - not var_studio_one_installed
    - var_studio_one_external_deb.stat.exists

- name: "[{{ user_os }}] Setup audio tools: studio one: copy pinned PKGBUILD"
  ansible.builtin.copy:
    src: "{{ role_path }}/files/studio-one-7/PKGBUILD"
    dest: "{{ arch_studio_one_build_dir }}/PKGBUILD"
    mode: "644"
  when:
    - not var_studio_one_installed
    - var_studio_one_external_deb.stat.exists

- name: "[{{ user_os }}] Setup audio tools: studio one: ensure runtime dependencies"
  become: true
  ansible.builtin.package:
    state: present
    name:
      - alsa-lib
      - egl-wayland
      - wayland
      - libjpeg-turbo
  when:
    - not var_studio_one_installed
    - var_studio_one_external_deb.stat.exists

- name: "[{{ user_os }}] Setup audio tools: studio one: build package"
  ansible.builtin.command:
    argv:
      - makepkg
      - -C
      - -c
      - -f
      - --noconfirm
  args:
    chdir: "{{ arch_studio_one_build_dir }}"
  environment:
    PKGEXT: ".pkg.tar"
  changed_when: true
  timeout: 0
  when:
    - not var_studio_one_installed
    - var_studio_one_external_deb.stat.exists

- name: "[{{ user_os }}] Setup audio tools: studio one: locate built package"
  ansible.builtin.find:
    paths: "{{ arch_studio_one_build_dir }}"
    patterns: "studio-one-7-{{ arch_studio_one_version }}-*.pkg.tar"
    file_type: file
  register: var_studio_one_built_package
  when:
    - not var_studio_one_installed
    - var_studio_one_external_deb.stat.exists

- name: "[{{ user_os }}] Setup audio tools: studio one: install package"
  become: true
  ansible.builtin.command:
    argv:
      - pacman
      - -U
      - --needed
      - --noconfirm
      - "{{ var_studio_one_built_package.files[0].path }}"
  changed_when: true
  timeout: 0
  notify: handler_update_desktop_database
  when:
    - not var_studio_one_installed
    - var_studio_one_external_deb.stat.exists
    - (var_studio_one_built_package.files | default([]) | length) > 0

- name: "[{{ user_os }}] Setup audio tools: studio one: stat installed desktop entry"
  ansible.builtin.stat:
    path: /usr/share/applications/com.presonus.studioapp7.desktop
  register: var_studio_one_desktop_entry

- name: "[{{ user_os }}] Setup audio tools: studio one: register scheme handler"
  # The deb postinst registers x-scheme-handler/studioone in the system
  # mimeapps.list; the Arch package() does not, so mirror it here. The user
  # mimeapps.list is Ansible-owned from the private package and must not be
  # rewritten by xdg-mime.
  become: true
  ansible.builtin.lineinfile:
    path: /etc/xdg/mimeapps.list
    create: true
    regexp: "^x-scheme-handler/studioone=.*"
    line: "x-scheme-handler/studioone=com.presonus.studioapp7.desktop"
    insertafter: "^\\[Default Applications\\]"
  when: var_studio_one_desktop_entry.stat.exists

# Studio One 7 Linux only runs as a Wayland client; this workstation's KDE
# session is X11, so the launcher hosts it inside a nested weston (X11 backend)
# and overrides the broken Exec the deb ships (it escapes spaces as literal
# backslash-s, so the stock menu entry does nothing).

- name: "[{{ user_os }}] Setup audio tools: studio one: ensure weston wayland host"
  become: true
  ansible.builtin.package:
    state: present
    name:
      - weston
  when:
    - var_studio_one_desktop_entry.stat.exists or var_studio_one_external_deb.stat.exists

- name: "[{{ user_os }}] Setup audio tools: studio one: setup launch-studio-one file"
  ansible.builtin.template:
    src: launch-studio-one
    dest: ~/.local/bin/launch-studio-one
    mode: "755"

- name: "[{{ user_os }}] Setup audio tools: studio one: setup nested-weston desktop entry"
  ansible.builtin.template:
    src: com.presonus.studioapp7.desktop
    dest: ~/.local/share/applications/com.presonus.studioapp7.desktop
    mode: "644"
  notify: handler_update_desktop_database

- name: "[{{ user_os }}] Setup audio tools: studio one: ensure weston config directory"
  ansible.builtin.file:
    path: ~/.config/dotfiles
    state: directory
    mode: "755"

- name: "[{{ user_os }}] Setup audio tools: studio one: setup weston config"
  # Removes the desktop-shell panel so it does not overlay Studio One's menu bar.
  ansible.builtin.template:
    src: weston-studio-one.ini
    dest: ~/.config/dotfiles/weston-studio-one.ini
    mode: "644"

- name: "[{{ user_os }}] Setup audio tools: setup launch-reaper-linux-legacy file"
  ansible.builtin.template:
    src: launch-reaper-linux-legacy
    dest: ~/.local/bin/launch-reaper-linux-legacy
    mode: "755"

- name: "[{{ user_os }}] Setup audio tools: ensure dotfiles config directory"
  ansible.builtin.file:
    path: ~/.config/dotfiles
    state: directory
    mode: "755"

- name: "[{{ user_os }}] Setup audio tools: setup audio latency defaults"
  ansible.builtin.template:
    src: audio-latency.defaults.env
    dest: ~/.config/dotfiles/audio-latency.defaults.env
    mode: "644"

- name: "[{{ user_os }}] Setup audio tools: ensure user services"
  ansible.builtin.systemd_service:
    scope: user
    name: "{{ item.name }}"
    enabled: "{{ item.enabled }}"
    masked: "{{ item.masked }}"
  loop:
    - { name: pipewire.socket, enabled: true, masked: false }
    - { name: pipewire-pulse.socket, enabled: true, masked: false }
    - { name: wireplumber.service, enabled: true, masked: false }

- name: "[{{ user_os }}] Setup audio tools: remove legacy Scarlett monitoring stow enablement"
  ansible.builtin.file:
    path: ~/.config/systemd/user/default.target.wants/configure-scarlett-monitoring.service
    state: absent

- name: "[{{ user_os }}] Setup audio tools: ensure Scarlett monitoring service"
  ansible.builtin.systemd_service:
    scope: user
    name: configure-scarlett-monitoring.service
    enabled: true
    masked: false
    state: started
    daemon_reload: true

- name: "[{{ user_os }}] Setup audio tools: create pipewire group"
  become: true
  ansible.builtin.group:
    name: pipewire

- name: "[{{ user_os }}] Setup audio tools: add user to realtime and audio groups"
  become: true
  ansible.builtin.user:
    append: true
    groups:
      - realtime
      - audio
      - pipewire
    name: "{{ ansible_facts.env.USER }}"

- name: "[{{ user_os }}] Setup audio tools: ensure path"
  ansible.builtin.file:
    path: /etc/sysctl.d/
    state: directory
    mode: "755"

- name: "[{{ user_os }}] Setup audio tools: max user freq"
  # https://wiki.archlinux.org/title/Professional_audio#Optimizing_system_configuration
  become: true
  ansible.builtin.command: "{{ item }}"
  changed_when: true
  loop:
    - echo 2048 > /sys/class/rtc/rtc0/max_user_freq
    - echo 2048 > /proc/sys/dev/hpet/max-user-freq
    - setpci -v -d *:* latency_timer=b0
    - setpci -v -s 06:00.6 latency_timer=ff

- name: "[{{ user_os }}] Setup audio tools: setup swappiness"
  become: true
  ansible.builtin.copy:
    src: 90-swappiness.conf
    dest: /etc/sysctl.d/90-swappiness.conf
    mode: "644"

- name: "[{{ user_os }}] Setup audio tools: setup max user watches"
  become: true
  ansible.builtin.copy:
    src: 90-max_user_watches.conf
    dest: /etc/sysctl.d/90-max_user_watches.conf
    mode: "644"

- name: "[{{ user_os }}] Setup audio tools: enable threadirqs"
  become: true
  ansible.builtin.copy:
    src: audio.conf
    dest: /etc/cmdline.d/audio.conf
    mode: "644"

- name: "[{{ user_os }}] Setup audio tools: stat cpupower config file"
  become: true
  ansible.builtin.stat:
    path: /etc/default/cpupower-service.conf
  register: var_cpupower

- name: "[{{ user_os }}] Setup audio tools: check cpupower idle governor support"
  # Idle/default governor applied at boot. REAPER raises this to 'performance'
  # on demand via cpu-governor-boost.service (see tasks below).
  ansible.builtin.command:
    argv:
      - grep
      - -qw
      - schedutil
      - /sys/devices/system/cpu/cpufreq/policy0/scaling_available_governors
  register: var_cpupower_idle_governor
  changed_when: false
  failed_when: false

- name: "[{{ user_os }}] Setup audio tools: governor schedutil"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ var_cpupower.stat.path }}"
    regexp: "^#?GOVERNOR=.*"
    line: "GOVERNOR='schedutil'"
  when:
    - var_cpupower.stat.exists
    - var_cpupower_idle_governor.rc == 0

- name: "[{{ user_os }}] Setup audio tools: ensure cpupower service"
  become: true
  ansible.builtin.systemd_service:
    scope: system
