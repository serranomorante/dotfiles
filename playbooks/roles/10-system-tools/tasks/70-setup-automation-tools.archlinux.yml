---
- name: "[{{ user_os }}] Automation utilities: ensure packages"
  become: true
  ansible.builtin.pacman:
    state: present
    name:
      - perl # needed to build xdotool
      - ydotool
      - xdotool

- name: "[{{ user_os }}] Automation utilities: ensure ydotoold service"
  ansible.builtin.systemd_service:
    scope: user
    name: ydotool.service
    enabled: true
    masked: false
