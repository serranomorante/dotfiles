---
- name: "[{{ user_os }}] Setup video tools: ensure video-tools folder"
  ansible.builtin.file:
    path: ~/data/apps/video-tools
    state: directory
    mode: "755"

- name: "[{{ user_os }}] Setup video tools: fix permission denied issue with davinci install"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - ~/temp/makepkg/davinci-resolve
    - ~/makepkg/davinci-resolve

- name: "[{{ user_os }}] Setup video tools: ensure davinci-resolve folder"
  ansible.builtin.file:
    path: ~/data/apps/video-tools/davinci-resolve
    state: directory
    mode: "755"

- name: "[{{ user_os }}] Setup video tools: get installed davinci-resolve version"
  ansible.builtin.command: pacman -Q davinci-resolve
  changed_when: false
  failed_when: false
  register: var_pacman_davinci_resolve

- name: "[{{ user_os }}] Setup video tools: set installed davinci-resolve facts"
  ansible.builtin.set_fact:
    var_davinci_resolve_installed_version: >-
      {{
        var_pacman_davinci_resolve.stdout.split()[1].split('-')[0]
        if var_pacman_davinci_resolve.rc == 0 and (var_pacman_davinci_resolve.stdout.split() | length) > 1
        else ''
      }}
    var_davinci_resolve_version_installed: >-
      {{
        var_pacman_davinci_resolve.rc == 0 and
        (var_pacman_davinci_resolve.stdout.split() | length) > 1 and
        var_pacman_davinci_resolve.stdout.split()[1].split('-')[0] == arch_davinci_resolve_version
      }}

- name: "[{{ user_os }}] Setup video tools: stat davinci-resolve zip package before download"
  ansible.builtin.stat:
    path: ~/data/apps/video-tools/davinci-resolve/DaVinci_Resolve_{{ arch_davinci_resolve_version }}_Linux.zip
    get_checksum: false
  register: var_stat_davinci_zip_before_download

- name: "[{{ user_os }}] Setup video tools: stat opencode executable"
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/bin/opencode"
  register: var_stat_opencode_executable
  when:
    - is_x_display_session
    - not var_davinci_resolve_version_installed
    - not var_stat_davinci_zip_before_download.stat.exists

- name: "[{{ user_os }}] Setup video tools: stat opencode firejail wrapper"
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/bin/fj-opencode"
  register: var_stat_opencode_firejail_wrapper
  when:
    - is_x_display_session
    - not var_davinci_resolve_version_installed
    - not var_stat_davinci_zip_before_download.stat.exists

- name: "[{{ user_os }}] Setup video tools: stat agent-local-execution"
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/bin/agent-local-execution"
  register: var_stat_agent_local_execution
  when:
    - is_x_display_session
    - not var_davinci_resolve_version_installed
    - not var_stat_davinci_zip_before_download.stat.exists

- name: "[{{ user_os }}] Setup video tools: register davinci resolve blackmagic email"
  ansible.builtin.command: >-
    kwallet-query --folder {{ davinci_resolve_blackmagic_email_keyring.folder }}
    --read-password {{ davinci_resolve_blackmagic_email_keyring.passkey }}
    {{ davinci_resolve_blackmagic_email_keyring.wallet }}
  changed_when: false
  failed_when: false
  register: var_davinci_resolve_blackmagic_email
  no_log: true
  when:
    - is_x_display_session
    - not var_davinci_resolve_version_installed
    - not var_stat_davinci_zip_before_download.stat.exists
    - (var_stat_opencode_executable.stat.exists | default(false))
    - (var_stat_opencode_firejail_wrapper.stat.exists | default(false))
    - (var_stat_agent_local_execution.stat.exists | default(false))

- name: "[{{ user_os }}] Setup video tools: register davinci resolve blackmagic password"
  ansible.builtin.command: >-
    kwallet-query --folder {{ davinci_resolve_blackmagic_password_keyring.folder }}
    --read-password {{ davinci_resolve_blackmagic_password_keyring.passkey }}
    {{ davinci_resolve_blackmagic_password_keyring.wallet }}
  changed_when: false
  failed_when: false
  register: var_davinci_resolve_blackmagic_password
  no_log: true
  when:
    - is_x_display_session
    - not var_davinci_resolve_version_installed
    - not var_stat_davinci_zip_before_download.stat.exists
    - (var_stat_opencode_executable.stat.exists | default(false))
    - (var_stat_opencode_firejail_wrapper.stat.exists | default(false))
    - (var_stat_agent_local_execution.stat.exists | default(false))

- name: "[{{ user_os }}] Setup video tools: download davinci resolve with opencode"
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.env.HOME }}/bin/agent-local-execution"
      - --agent
      - opencode
      - --raw
      - --cwd
      - "{{ ansible_facts.env.HOME }}/Downloads"
      - --timeout
      - "1800"
  args:
    creates: "{{ ansible_facts.env.HOME }}/data/apps/video-tools/davinci-resolve/DaVinci_Resolve_{{ arch_davinci_resolve_version }}_Linux.zip"
    chdir: "{{ ansible_facts.env.HOME }}/Downloads"
    stdin: "{{ lookup('template', 'davinci-resolve-download-prompt.txt.j2') }}"
  changed_when: true
  timeout: 1800
  register: var_download_davinci_result
  ignore_errors: true
  no_log: true
  when:
    - is_x_display_session
    - not var_davinci_resolve_version_installed
    - not var_stat_davinci_zip_before_download.stat.exists
    - (var_stat_opencode_executable.stat.exists | default(false))
    - (var_stat_opencode_firejail_wrapper.stat.exists | default(false))
    - (var_stat_agent_local_execution.stat.exists | default(false))
    - (var_davinci_resolve_blackmagic_email.rc | default(1)) == 0
    - (var_davinci_resolve_blackmagic_email.stdout | default('') | trim | length) > 0
    - (var_davinci_resolve_blackmagic_password.rc | default(1)) == 0
    - (var_davinci_resolve_blackmagic_password.stdout | default('') | trim | length) > 0

- name: "[{{ user_os }}] Setup video tools: wait for davinci to download"
  ansible.builtin.wait_for:
    path: ~/Downloads/DaVinci_Resolve_{{ arch_davinci_resolve_version }}_Linux.zip
    msg: Timeout waiting for davinci resolve to download
    delay: 5
    timeout: 600
  timeout: 0
  when:
    - is_x_display_session
    - not var_davinci_resolve_version_installed
    - var_download_davinci_result is defined
    - var_download_davinci_result is succeeded
    - var_download_davinci_result.changed | default(false)

- name: "[{{ user_os }}] Setup video tools: stat downloaded davinci resolve file"
  ansible.builtin.stat:
    path: ~/Downloads/DaVinci_Resolve_{{ arch_davinci_resolve_version }}_Linux.zip
    get_checksum: false
  register: var_stat_downloaded_davinci_resolve_file

- name: "[{{ user_os }}] Setup video tools: move davinci resolve zip to expected location"
  ansible.builtin.command: mv DaVinci_Resolve_{{ arch_davinci_resolve_version }}_Linux.zip ~/data/apps/video-tools/davinci-resolve/
  args:
    chdir: ~/Downloads
    creates: ~/data/apps/video-tools/davinci-resolve/DaVinci_Resolve_{{ arch_davinci_resolve_version }}_Linux.zip
  when:
    - is_x_display_session
    - not var_davinci_resolve_version_installed
    - var_stat_downloaded_davinci_resolve_file.stat.exists
    - ((var_stat_downloaded_davinci_resolve_file.stat.size / 1024 / 1024) | int > 1000) # at least greater than 1G

- name: "[{{ user_os }}] Setup video tools: stat davinci-resolve zip package"
  ansible.builtin.stat:
    path: ~/data/apps/video-tools/davinci-resolve/DaVinci_Resolve_{{ arch_davinci_resolve_version }}_Linux.zip
    get_checksum: false
  register: var_stat_davinci_zip

- name: "[{{ user_os }}] Setup video tools: download aur package"
  # Always re-fetch so the PKGBUILD matches the pinned AUR version, not a
  # previously extracted snapshot; guarded by the version-installed check below.
  ansible.builtin.unarchive:
    src: https://aur.archlinux.org/cgit/aur.git/snapshot/davinci-resolve.tar.gz
    dest: ~/data/apps/video-tools/
    remote_src: true
  when:
    - is_x_display_session
    - not var_davinci_resolve_version_installed
    - var_stat_davinci_zip.stat.exists

- name: "[{{ user_os }}] Setup video tools: ensure same davinci-resolve version"
  ansible.builtin.replace:
    path: ~/data/apps/video-tools/davinci-resolve/PKGBUILD
    regexp: "^pkgver=.*"
    replace: "pkgver={{ arch_davinci_resolve_version }}"
  when:
    - is_x_display_session
    - not var_davinci_resolve_version_installed
    - var_stat_davinci_zip.stat.exists

- name: "[{{ user_os }}] Setup video tools: recompute davinci-resolve source checksums"
  ansible.builtin.command:
    argv:
      - updpkgsums
  args:
    chdir: ~/data/apps/video-tools/davinci-resolve
  changed_when: true
  timeout: 0
  when:
    - is_x_display_session
    - not var_davinci_resolve_version_installed
    - var_stat_davinci_zip.stat.exists

- name: "[{{ user_os }}] Setup video tools: ensure packages"
  become: true
  ansible.builtin.package:
    state: present
    name:
      - mesa
      - expac
      - guvcview

- name: "[{{ user_os }}] Setup video tools: temporary give tmpfs more space"
  become: true
  ansible.builtin.command: mount -o remount,size=80% /tmp
  changed_when: true

- name: "[{{ user_os }}] Setup video tools: ensure davinci-resolve folder permissions"
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    group: "{{ ansible_facts.env.USER }}"
    owner: "{{ ansible_facts.env.USER }}"
    state: directory
    mode: "750"
  loop:
    - "{{ ansible_facts.env.HOME }}"
    - "{{ ansible_facts.env.HOME }}/data"
    - "{{ ansible_facts.env.HOME }}/data/apps"
    - "{{ ansible_facts.env.HOME }}/data/apps/video-tools"
    - "{{ ansible_facts.env.HOME }}/data/apps/video-tools/davinci-resolve"
  when:
    - is_x_display_session
    - not var_davinci_resolve_version_installed
    - var_stat_davinci_zip.stat.exists

- name: "[{{ user_os }}] Setup video tools: ensure packages (needs display)"
  # https://github.com/Ashark/davinci-resolve-checker?tab=readme-ov-file#installation
  become: true
  ansible.builtin.package:
    state: present
    name:
      - mesa-utils
      - lib32-mesa-utils
      - handbrake-cli
      - python-distro
      - opencl-nvidia
      - lib32-opencl-nvidia
      - mingw-w64
      - blender
  when: is_x_display_session

- name: "[{{ user_os }}] Setup video tools: ensure absent packages"
  # this also makes CUDA work on davinci-resolve
  become: true
  ansible.builtin.package:
    state: absent
    name: opencl-mesa
  when: is_x_display_session

- name: "[{{ user_os }}] Setup video tools: ensure pip deps for davinci-resolve-checker"
  ansible.builtin.include_role:
    name: update-diff-capture
    tasks_from: pip
  vars:
    update_diff_capture_scope: video-tools
    update_diff_pip_venv: "{{ ansible_facts.env.HOME }}/data/apps/video-tools/.venv"
    update_diff_pip_executable: "{{ ansible_facts.env.HOME }}/bin/ansible-firejail-pip"
    update_diff_pip_packages:
      - name: distro
      - name: pylspci

- name: "[{{ user_os }}] Setup video tools: clone davinci-resolve-checker repo"
  ansible.builtin.git:
    repo: https://github.com/Ashark/davinci-resolve-checker
    executable: "{{ ansible_facts.env.HOME }}/dotfiles/utilities/bin/dotfiles-github-git"
    dest: ~/data/repos/davinci-resolve-checker
    version: master
    single_branch: true
    depth: 1

- name: "[{{ user_os }}] Setup video tools: ensure davinci-resolve build dependencies"
  # davinci-resolve is the one AUR package installed directly (not via aur-review).
  # opencl-driver is satisfied by opencl-nvidia (installed above) and java-runtime
  # by jdk-openjdk (installed by the browser tools task).
  become: true
  ansible.builtin.package:
    state: present
    name:
      - glu
      - fuse2
      - qt5-x11extras
      - qt5-svg
      - qt5-quickcontrols2
      - qt5-multimedia
      - libxcrypt-compat
      - xmlsec
      - gst-plugins-bad-libs
      - python-numpy
      - tbb
      - apr-util
      - luajit
      - libc++
      - libc++abi
      - ffmpeg4.4
      - libarchive
      - xdg-user-dirs
      - patchelf
  when:
    - is_x_display_session
    - not var_davinci_resolve_version_installed
    - var_stat_davinci_zip.stat.exists

- name: "[{{ user_os }}] Setup video tools: build davinci-resolve package"
  ansible.builtin.command:
    argv:
      - makepkg
      - -C
      - -c
      - -f
      - --noconfirm
  args:
    chdir: ~/data/apps/video-tools/davinci-resolve
  environment:
    # https://wiki.archlinux.org/title/DaVinci_Resolve
    PKGEXT: ".pkg.tar"
  changed_when: true
  timeout: 0
  when:
    - is_x_display_session
    - not var_davinci_resolve_version_installed
    - var_stat_davinci_zip.stat.exists

- name: "[{{ user_os }}] Setup video tools: locate built davinci-resolve package"
  ansible.builtin.find:
    paths: ~/data/apps/video-tools/davinci-resolve
    patterns: "davinci-resolve-{{ arch_davinci_resolve_version }}-*.pkg.tar"
    file_type: file
  register: var_davinci_resolve_built_package
  when:
    - is_x_display_session
    - not var_davinci_resolve_version_installed
    - var_stat_davinci_zip.stat.exists

- name: "[{{ user_os }}] Setup video tools: install davinci-resolve package"
  become: true
  ansible.builtin.command:
    argv:
      - pacman
      - -U
      - --needed
      - --noconfirm
      - "{{ var_davinci_resolve_built_package.files[0].path }}"
  changed_when: true
  timeout: 0
  when:
    - is_x_display_session
    - not var_davinci_resolve_version_installed
    - var_stat_davinci_zip.stat.exists
    - (var_davinci_resolve_built_package.files | default([]) | length) > 0

- name: "[{{ user_os }}] Setup video tools: remove faulty wine .dekstop"
  ansible.builtin.file:
    state: absent
    path: ~/.local/share/applications/wine-extension-braw.desktop
