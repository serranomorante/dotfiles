---
- name: "[{{ user_os }}] Nvidia display profile: validate profile"
  ansible.builtin.assert:
    that:
      - arch_nvidia_display_profile in ['offload_only', 'reverse_prime']
    fail_msg: "arch_nvidia_display_profile must be either offload_only or reverse_prime."

- name: "[{{ user_os }}] Nvidia display profile: refresh SDDM Xsetup"
  become: true
  ansible.builtin.template:
    src: sddm/Xsetup
    dest: /usr/share/sddm/scripts/Xsetup
    owner: root
    mode: "744"
  when: arch_has_nvidia_gpu

- name: "[{{ user_os }}] Nvidia display profile: check nvidia-persistenced service"
  ansible.builtin.command: systemctl list-unit-files nvidia-persistenced.service
  changed_when: true
  ignore_errors: true
  register: var_nvidia_persistenced_service
  when: arch_has_nvidia_gpu

- name: "[{{ user_os }}] Nvidia display profile: manage nvidia-persistenced service"
  become: true
  ansible.builtin.systemd_service:
    scope: system
    name: nvidia-persistenced.service
    enabled: "{{ arch_nvidia_display_profile == 'reverse_prime' }}"
    masked: false
    state: "{{ 'started' if arch_nvidia_display_profile == 'reverse_prime' else 'stopped' }}"
  when:
    - arch_has_nvidia_gpu
    - "'nvidia-persistenced.service' in var_nvidia_persistenced_service.stdout"

- name: "[{{ user_os }}] Nvidia display profile: add reverse PRIME config"
  become: true
  ansible.builtin.copy:
    src: nvidia/80-igpu-primary-egpu-offload.conf
    dest: /etc/X11/xorg.conf.d/80-igpu-primary-egpu-offload.conf
    mode: "644"
  when:
    - arch_has_nvidia_gpu
    - arch_nvidia_display_profile == 'reverse_prime'

- name: "[{{ user_os }}] Nvidia display profile: remove reverse PRIME config outside reverse PRIME profile"
  become: true
  ansible.builtin.file:
    path: /etc/X11/xorg.conf.d/80-igpu-primary-egpu-offload.conf
    state: absent
  when:
    - arch_has_nvidia_gpu
    - arch_nvidia_display_profile == 'offload_only'
