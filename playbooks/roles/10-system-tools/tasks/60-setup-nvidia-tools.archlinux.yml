---
- name: "[{{ user_os }}] Nvidia tools: require nvidia hardware fact"
  ansible.builtin.assert:
    that:
      - arch_has_nvidia_gpu is defined
    fail_msg: "arch_has_nvidia_gpu must be set by the playbook pre_tasks before running nvidia tools."

- name: "[{{ user_os }}] Nvidia tools: remove LTS-only kernel module packages"
  become: true
  ansible.builtin.package:
    name:
      - nvidia-open-lts
      - nvidia-lts
    state: absent
  when:
    - arch_has_nvidia_gpu
    - is_x_display_session

- name: "[{{ user_os }}] Nvidia tools: ensure nvidia packages"
  become: true
  ansible.builtin.package:
    name:
      - nvidia-open-dkms
      - nvidia-prime
      - nvidia-settings
      - nvidia-utils
      - lib32-nvidia-utils
  when:
    - arch_has_nvidia_gpu
    - is_x_display_session

- name: "[{{ user_os }}] Nvidia tools: ensure local AUR packages"
  ansible.builtin.include_tasks: "{{ ansible_facts.env.HOME }}/dotfiles/playbooks/roles/10-system-tools/tasks/install-local-aur-packages.archlinux.yml"
  vars:
    aur_local_packages: nvidia-prime-rtd3pm
  when: arch_has_nvidia_gpu

- name: "[{{ user_os }}] Nvidia tools: add kernel param"
  become: true
  ansible.builtin.copy:
    src: nvidia/video.conf
    dest: /etc/cmdline.d/video.conf
    mode: "644"
  notify: handler_mkinitcpio_allpresets
  when: arch_has_nvidia_gpu

- name: "[{{ user_os }}] Nvidia tools: remove nvidia config when no nvidia gpu is present"
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/X11/xorg.conf.d/80-igpu-primary-egpu-offload.conf
    - /etc/cmdline.d/video.conf
  notify: handler_mkinitcpio_allpresets
  when: not arch_has_nvidia_gpu
