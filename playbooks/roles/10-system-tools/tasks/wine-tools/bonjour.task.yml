---
- name: "[archlinux] Wine tools: stat bonjour installer"
  ansible.builtin.stat:
    path: "{{ arch_bonjour_setup.backup_path }}/{{ arch_bonjour_setup.installer_name }}"
  register: var_bonjour_installer

- name: "[archlinux] Wine tools: ensure bonjour installer exists"
  ansible.builtin.assert:
    that:
      - var_bonjour_installer.stat.exists
    fail_msg: "BonjourPSSetup.exe must exist at {{ arch_bonjour_setup.backup_path }}/{{ arch_bonjour_setup.installer_name }}"

- name: "[archlinux] Wine tools: install bonjour"
  ansible.builtin.command: >
    {{ ansible_facts.env.HOME }}/bin/wwine --prefix reaper
    wine start /wait /unix '{{ arch_bonjour_setup.backup_path }}/{{ arch_bonjour_setup.installer_name }}'
  timeout: 300
  changed_when: true
  args:
    creates: "{{ arch_bonjour_setup.wine_prefix }}/drive_c/Program Files/Bonjour/mDNSResponder.exe"
  register: var_install_bonjour
  when: is_x_display_session

- name: "[archlinux] Wine tools: close stale Bonjour Wine processes"
  ansible.builtin.command: >
    {{ ansible_facts.env.HOME }}/bin/wwine --prefix reaper kill-prefix
  timeout: 60
  changed_when: true
  failed_when: false
  no_log: true
  when: var_install_bonjour is defined and var_install_bonjour.changed
