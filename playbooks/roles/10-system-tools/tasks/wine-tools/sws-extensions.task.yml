---
- name: "[archlinux] Wine tools: install arch sws extension"
  become: true
  ansible.builtin.package:
    name: sws
    state: present

- name: "[archlinux] Wine tools: ensure native reaper sws folders"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "755"
  loop:
    - ~/.config/REAPER/UserPlugins
    - ~/.config/REAPER/Scripts
    - ~/.config/REAPER/Scripts/custom
    - ~/.config/REAPER/Data/helgoboss/realearn/presets/main
    - ~/.vst

- name: "[archlinux] Wine tools: get native Helgobox/ReaLearn"
  ansible.builtin.get_url:
    url: "https://github.com/helgoboss/helgobox/releases/download/v{{ arch_helgobox_setup.version }}/{{ item.name }}"
    dest: "{{ arch_helgobox_setup.backup_path }}/{{ item.name }}"
    checksum: "{{ item.checksum }}"
    mode: "755"
  loop:
    - name: "{{ arch_helgobox_setup.linux_vst_name }}"
      checksum: "{{ arch_helgobox_setup.linux_vst_checksum }}"
    - name: "{{ arch_helgobox_setup.linux_reaper_extension_name }}"
      checksum: "{{ arch_helgobox_setup.linux_reaper_extension_checksum }}"

- name: "[archlinux] Wine tools: install native Helgobox/ReaLearn VST"
  ansible.builtin.copy:
    src: "{{ arch_helgobox_setup.backup_path }}/{{ arch_helgobox_setup.linux_vst_name }}"
    dest: "~/.vst/{{ arch_helgobox_setup.linux_vst_name }}"
    mode: "755"
    remote_src: true

- name: "[archlinux] Wine tools: check native Helgobox/ReaLearn xdo ABI"
  ansible.builtin.command: patchelf --print-needed "{{ ansible_facts.env.HOME }}/.vst/{{ arch_helgobox_setup.linux_vst_name }}"
  changed_when: false
  register: var_native_helgobox_needed

- name: "[archlinux] Wine tools: patch native Helgobox/ReaLearn xdo ABI"
  ansible.builtin.command: >
    patchelf --replace-needed libxdo.so.3 libxdo.so.4
    "{{ ansible_facts.env.HOME }}/.vst/{{ arch_helgobox_setup.linux_vst_name }}"
  changed_when: true
  when: "'libxdo.so.3' in var_native_helgobox_needed.stdout_lines"

- name: "[archlinux] Wine tools: stat native reaper ini"
  ansible.builtin.stat:
    path: ~/.config/REAPER/REAPER.ini
  register: var_native_reaper_ini

- name: "[archlinux] Wine tools: check native reaper VST path key"
  ansible.builtin.command: grep -Eq "^vstpath64=" "{{ ansible_facts.env.HOME }}/.config/REAPER/REAPER.ini"
  changed_when: false
  failed_when: false
  register: var_native_reaper_vstpath64_key
  when: var_native_reaper_ini.stat.exists

- name: "[archlinux] Wine tools: check native reaper user VST path"
  ansible.builtin.command: grep -Eq "^vstpath64=.*(^|;){{ ansible_facts.env.HOME | regex_escape }}/\\.vst(;|$)" "{{ ansible_facts.env.HOME
    }}/.config/REAPER/REAPER.ini"
  changed_when: false
  failed_when: false
  register: var_native_reaper_user_vst_path
  when: var_native_reaper_ini.stat.exists

- name: "[archlinux] Wine tools: add native reaper VST path key"
  ansible.builtin.lineinfile:
    path: ~/.config/REAPER/REAPER.ini
    insertafter: "^\\[reaper\\]"
    line: "vstpath64={{ ansible_facts.env.HOME }}/.vst"
    mode: "644"
  when:
    - var_native_reaper_ini.stat.exists
    - var_native_reaper_vstpath64_key.rc != 0

- name: "[archlinux] Wine tools: prepend native reaper user VST path"
  ansible.builtin.lineinfile:
    path: ~/.config/REAPER/REAPER.ini
    regexp: "^vstpath64=(.*)$"
    line: "vstpath64={{ ansible_facts.env.HOME }}/.vst;\\1"
    backrefs: true
  when:
    - var_native_reaper_ini.stat.exists
    - var_native_reaper_vstpath64_key.rc == 0
    - var_native_reaper_user_vst_path.rc != 0

- name: "[archlinux] Wine tools: install native Helgobox/ReaLearn extension"
  ansible.builtin.copy:
    src: "{{ arch_helgobox_setup.backup_path }}/{{ arch_helgobox_setup.linux_reaper_extension_name }}"
    dest: "~/.config/REAPER/UserPlugins/{{ arch_helgobox_setup.linux_reaper_extension_name }}"
    mode: "755"
    remote_src: true

- name: "[archlinux] Wine tools: get wine Helgobox/ReaLearn"
  ansible.builtin.get_url:
    url: "https://github.com/helgoboss/helgobox/releases/download/v{{ arch_helgobox_setup.version }}/{{ item.name }}"
    dest: "{{ arch_helgobox_setup.backup_path }}/{{ item.name }}"
    checksum: "{{ item.checksum }}"
    mode: "755"
  loop:
    - name: "{{ arch_helgobox_setup.windows_vst_name }}"
      checksum: "{{ arch_helgobox_setup.windows_vst_checksum }}"
    - name: "{{ arch_helgobox_setup.windows_reaper_extension_name }}"
      checksum: "{{ arch_helgobox_setup.windows_reaper_extension_checksum }}"

- name: "[archlinux] Wine tools: ensure wine Helgobox/ReaLearn folders"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "755"
  loop:
    - "{{ arch_reaper_wine_setup.wine_prefix }}/drive_c/Program Files/VSTPlugins"
    - "{{ arch_reaper_wine_setup.wine_prefix }}/drive_c/users/{{ ansible_facts.env.USER }}/AppData"
    - "{{ arch_reaper_wine_setup.wine_prefix }}/drive_c/users/{{ ansible_facts.env.USER }}/AppData/Roaming"
    - "{{ arch_reaper_wine_setup.wine_prefix }}/drive_c/users/{{ ansible_facts.env.USER }}/AppData/Roaming/REAPER"
    - "{{ arch_reaper_wine_setup.wine_prefix }}/drive_c/users/{{ ansible_facts.env.USER }}/AppData/Roaming/REAPER/UserPlugins"

- name: "[archlinux] Wine tools: install wine Helgobox/ReaLearn VST"
  ansible.builtin.copy:
    src: "{{ arch_helgobox_setup.backup_path }}/{{ arch_helgobox_setup.windows_vst_name }}"
    dest: "{{ arch_reaper_wine_setup.wine_prefix }}/drive_c/Program Files/VSTPlugins/{{ arch_helgobox_setup.windows_vst_name }}"
    mode: "755"
    remote_src: true

- name: "[archlinux] Wine tools: install wine Helgobox/ReaLearn extension"
  ansible.builtin.copy:
    src: "{{ arch_helgobox_setup.backup_path }}/{{ arch_helgobox_setup.windows_reaper_extension_name }}"
    dest: "{{ arch_reaper_wine_setup.wine_prefix }}/drive_c/users/{{ ansible_facts.env.USER }}/AppData/Roaming/REAPER/UserPlugins/{{ arch_helgobox_setup.windows_reaper_extension_name }}"
    mode: "755"
    remote_src: true

- name: "[archlinux] Wine tools: stat wine reaper ini for Helgobox/ReaLearn"
  ansible.builtin.stat:
    path: "{{ arch_reaper_wine_setup.wine_prefix }}/drive_c/users/{{ ansible_facts.env.USER }}/AppData/Roaming/REAPER/REAPER.ini"
  register: var_wine_reaper_helgobox_ini

- name: "[archlinux] Wine tools: check wine reaper VST path key"
  ansible.builtin.command: grep -Eq "^vstpath64=" "{{ arch_reaper_wine_setup.wine_prefix }}/drive_c/users/{{ ansible_facts.env.USER }}/AppData/Roaming/REAPER/REAPER.ini"
  changed_when: false
  failed_when: false
  register: var_wine_reaper_vstpath64_key
  when: var_wine_reaper_helgobox_ini.stat.exists

- name: "[archlinux] Wine tools: check wine reaper Helgobox/ReaLearn VST path"
  ansible.builtin.command: grep -Eq "^vstpath64=.*(%PROGRAMFILES%\\\\\\\\VSTPlugins|C:\\\\\\\\Program Files\\\\\\\\VSTPlugins)(;|$)" "{{ arch_reaper_wine_setup.wine_prefix }}/drive_c/users/{{ ansible_facts.env.USER }}/AppData/Roaming/REAPER/REAPER.ini"
  changed_when: false
  failed_when: false
  register: var_wine_reaper_helgobox_vst_path
  when: var_wine_reaper_helgobox_ini.stat.exists

- name: "[archlinux] Wine tools: add wine reaper Helgobox/ReaLearn VST path key"
  ansible.builtin.lineinfile:
    path: "{{ arch_reaper_wine_setup.wine_prefix }}/drive_c/users/{{ ansible_facts.env.USER }}/AppData/Roaming/REAPER/REAPER.ini"
    insertafter: "^\\[reaper\\]"
    line: "vstpath64=%PROGRAMFILES%\\\\VSTPlugins"
    mode: "644"
  when:
    - var_wine_reaper_helgobox_ini.stat.exists
    - var_wine_reaper_vstpath64_key.rc != 0

- name: "[archlinux] Wine tools: prepend wine reaper Helgobox/ReaLearn VST path"
  ansible.builtin.lineinfile:
    path: "{{ arch_reaper_wine_setup.wine_prefix }}/drive_c/users/{{ ansible_facts.env.USER }}/AppData/Roaming/REAPER/REAPER.ini"
    regexp: "^vstpath64=(.*)$"
    line: "vstpath64=%PROGRAMFILES%\\\\VSTPlugins;\\1"
    backrefs: true
  when:
    - var_wine_reaper_helgobox_ini.stat.exists
    - var_wine_reaper_vstpath64_key.rc == 0
    - var_wine_reaper_helgobox_vst_path.rc != 0

- name: "[archlinux] Wine tools: symlink native reaper sws extension"
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop:
    - src: /usr/lib/sws/reaper_sws-x86_64.so
      dest: ~/.config/REAPER/UserPlugins/reaper_sws-x86_64.so
    - src: /usr/lib/sws/sws_python64.py
      dest: ~/.config/REAPER/Scripts/sws_python64.py

- name: "[archlinux] Wine tools: copy native reaper startup script"
  ansible.builtin.copy:
    src: "{{ ansible_facts.env.HOME }}/dotfiles/assets/scripts/reaper/__startup.lua"
    dest: ~/.config/REAPER/Scripts/__startup.lua
    mode: "644"

- name: "[archlinux] Wine tools: copy native reaper custom scripts"
  ansible.builtin.copy:
    src: "{{ ansible_facts.env.HOME }}/dotfiles/assets/scripts/reaper/{{ item }}"
    dest: "~/.config/REAPER/Scripts/custom/{{ item }}"
    mode: "644"
  loop:
    - alternate_position.lua
    - item_state_feedback.lua
    - midi_editor_state_feedback.lua
    - project_transport_state_feedback.lua
    - yabridge_focus_repair.lua

- name: "[archlinux] Wine tools: stat sws extension installer"
  ansible.builtin.stat:
    path: "{{ arch_reaper_sws_extension_setup.backup_path }}/sws-{{ arch_reaper_sws_extension_setup.version }}-Windows-x64.exe"
  register: var_sws_extension_installer

- name: "[archlinux] Wine tools: get sws extension"
  ansible.builtin.get_url:
    url: https://www.sws-extension.org/download/featured/sws-{{ arch_reaper_sws_extension_setup.version }}-Windows-x64.exe
    dest: "{{ arch_reaper_sws_extension_setup.backup_path }}/sws-{{ arch_reaper_sws_extension_setup.version }}-Windows-x64.exe"
    mode: "755"
  ignore_errors: true
  register: var_new_sws_extension_version_downloaded
  when: not var_sws_extension_installer.stat.exists

- name: "[archlinux] Wine tools: stat installed sws extension"
  ansible.builtin.stat:
    path: "{{ arch_reaper_wine_setup.wine_prefix }}/drive_c/users/{{ ansible_facts.env.USER }}/AppData/Roaming/REAPER/UserPlugins/reaper_sws-x64.dll"
  register: var_sws_extension_installed

- name: "[archlinux] Wine tools: install sws extension"
  ansible.builtin.command: >
    {{ ansible_facts.env.HOME }}/bin/wwine --prefix reaper
    wine start /wait /unix
    '{{ arch_reaper_sws_extension_setup.backup_path }}/sws-{{ arch_reaper_sws_extension_setup.version }}-Windows-x64.exe'
  timeout: 300
  changed_when: true
  failed_when: false
  when:
    - is_x_display_session
    - not var_sws_extension_installed.stat.exists
    - >
      var_sws_extension_installer.stat.exists
      or
      (var_new_sws_extension_version_downloaded.changed | default(false))
  register: var_sws_install

- name: "[archlinux] Wine tools: close stale SWS installer Wine processes"
  ansible.builtin.command: >
    {{ ansible_facts.env.HOME }}/bin/wwine --prefix reaper kill-prefix
  timeout: 60
  changed_when: true
  failed_when: false
  no_log: true
  when: var_sws_install.changed | default(false)

- name: "[archlinux] Wine tools: ensure custom script folder"
  ansible.builtin.file:
    state: directory
    path: "{{ item }}"
    mode: "755"
  loop:
    - "{{ arch_reaper_wine_setup.wine_prefix }}/drive_c/users/{{ ansible_facts.env.USER }}/AppData"
    - "{{ arch_reaper_wine_setup.wine_prefix }}/drive_c/users/{{ ansible_facts.env.USER }}/AppData/Roaming"
    - "{{ arch_reaper_wine_setup.wine_prefix }}/drive_c/users/{{ ansible_facts.env.USER }}/AppData/Roaming/REAPER/"
    - "{{ arch_reaper_wine_setup.wine_prefix }}/drive_c/users/{{ ansible_facts.env.USER }}/AppData/Roaming/REAPER/Scripts"
    - "{{ arch_reaper_wine_setup.wine_prefix }}/drive_c/users/{{ ansible_facts.env.USER }}/AppData/Roaming/REAPER/Scripts/custom"
    - "{{ arch_reaper_wine_setup.wine_prefix }}/drive_c/users/{{ ansible_facts.env.USER }}/AppData/Roaming/REAPER/Data/helgoboss/realearn/presets/main"
    - "{{ ansible_facts.env.XDG_STATE_HOME | default(ansible_facts.env.HOME ~ '/.local/state') }}/dotfiles/reaper-track-lock-sync"

- name: "[archlinux] Wine tools: ensure canonical ReaLearn main preset folder"
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/dotfiles/assets/reaper/realearn/presets/main/{{ ansible_facts.env.USER }}"
    state: directory
    mode: "755"

- name: "[archlinux] Wine tools: stat ReaLearn main preset folders"
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
  loop:
    - name: native
      path: "{{ ansible_facts.env.HOME }}/.config/REAPER/Data/helgoboss/realearn/presets/main/{{ ansible_facts.env.USER }}"
    - name: wine
      path: "{{ arch_reaper_wine_setup.wine_prefix }}/drive_c/users/{{ ansible_facts.env.USER }}/AppData/Roaming/REAPER/Data/helgoboss/realearn/presets/main/{{ ansible_facts.env.USER }}"
  register: var_reaper_reallearn_main_preset_folders

- name: "[archlinux] Wine tools: migrate existing ReaLearn main preset folders"
  ansible.builtin.command:
    argv:
      - cp
      - -a
      - -u
      - "{{ item.item.path }}/."
      - "{{ ansible_facts.env.HOME }}/dotfiles/assets/reaper/realearn/presets/main/{{ ansible_facts.env.USER }}/"
  register: var_reaper_reallearn_main_preset_migration
  changed_when: true
  failed_when: >
    var_reaper_reallearn_main_preset_migration.rc != 0 and
    (
      var_reaper_reallearn_main_preset_migration.stderr_lines
      | reject('search', 'are the same file')
      | list
      | length
    ) > 0
  loop: "{{ var_reaper_reallearn_main_preset_folders.results }}"
  when:
    - item.stat.exists
    - item.stat.isdir | default(false)
    - not (item.stat.islnk | default(false))

- name: "[archlinux] Wine tools: remove migrated ReaLearn main preset folders"
  ansible.builtin.file:
    path: "{{ item.item.path }}"
    state: absent
  loop: "{{ var_reaper_reallearn_main_preset_folders.results }}"
  when:
    - item.stat.exists
    - item.stat.islnk | default(false) or item.stat.isdir | default(false)

- name: "[archlinux] Wine tools: ensure ReaLearn main preset folders"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "755"
  loop:
    - name: native
      path: "{{ ansible_facts.env.HOME }}/.config/REAPER/Data/helgoboss/realearn/presets/main/{{ ansible_facts.env.USER }}"
    - name: wine
      path: "{{ arch_reaper_wine_setup.wine_prefix }}/drive_c/users/{{ ansible_facts.env.USER }}/AppData/Roaming/REAPER/Data/helgoboss/realearn/presets/main/{{ ansible_facts.env.USER }}"

- name: "[archlinux] Wine tools: hardlink ReaLearn main preset files"
  ansible.builtin.file:
    src: "{{ ansible_facts.env.HOME }}/dotfiles/assets/reaper/realearn/presets/main/{{ ansible_facts.env.USER }}/{{ item.file }}"
    dest: "{{ item.dest }}/{{ item.file }}"
    state: hard
    force: true
  loop:
    - file: beatstep.json
      dest: "{{ ansible_facts.env.HOME }}/.config/REAPER/Data/helgoboss/realearn/presets/main/{{ ansible_facts.env.USER }}"
    - file: beatstep.json
      dest: "{{ arch_reaper_wine_setup.wine_prefix }}/drive_c/users/{{ ansible_facts.env.USER }}/AppData/Roaming/REAPER/Data/helgoboss/realearn/presets/main/{{ ansible_facts.env.USER }}"

- name: "[archlinux] Wine tools: copy wine reaper startup script"
  ansible.builtin.copy:
    dest: "{{ arch_reaper_wine_setup.wine_prefix }}/drive_c/users/{{ ansible_facts.env.USER }}/AppData/Roaming/REAPER/Scripts/__startup.lua"
    mode: "644"
    content: |
      local resource_path = reaper.GetResourcePath()
      local startup_scripts = {
          resource_path .. "/Scripts/custom/track_lock_sync.lua",
          resource_path .. "/Scripts/custom/project_transport_state_feedback.lua",
          resource_path .. "/Scripts/custom/midi_editor_state_feedback.lua",
          resource_path .. "/Scripts/custom/item_state_feedback.lua",
      }

      for _, script in ipairs(startup_scripts) do
          local chunk, err = loadfile(script)
          if chunk then
              local ok, runtime_err = pcall(chunk)
              if not ok then
                  reaper.ShowConsoleMsg(("Startup script failed: %s\n%s\n"):format(script, runtime_err))
              end
          else
              reaper.ShowConsoleMsg(("Startup script missing or invalid: %s\n%s\n"):format(script, err))
          end
      end

- name: "[archlinux] Wine tools: copy wine reaper custom scripts"
  ansible.builtin.copy:
    src: "{{ ansible_facts.env.HOME }}/dotfiles/assets/scripts/reaper/{{ item }}"
    dest: "{{ arch_reaper_wine_setup.wine_prefix }}/drive_c/users/{{ ansible_facts.env.USER }}/AppData/Roaming/REAPER/Scripts/custom/{{ item }}"
    mode: "644"
  loop:
    - alternate_position.lua
    - item_state_feedback.lua
    - midi_editor_state_feedback.lua
    - project_transport_state_feedback.lua
    - track_lock_sync.lua
