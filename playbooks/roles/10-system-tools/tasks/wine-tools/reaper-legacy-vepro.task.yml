---
# Vienna Ensemble Pro bridge for the reaperlegacy prefix. Mirrors the VEPro
# bridge kept in the reaper/system prefix, but lives under the legacy (fsync)
# Wine prefix so native Linux REAPER + yabridge can run the VEP plugin against
# either Wine runtime without installing Windows REAPER here.
- name: "[{{ user_os }}] Wine tools: ensure reaperlegacy VEPro bridge folders"
  ansible.builtin.file:
    path: "{{ arch_reaper_legacy_vepro_bridge_path }}/{{ item }}"
    state: directory
    mode: "755"
  loop:
    - VST2
    - VST3

- name: "[{{ user_os }}] Wine tools: link VEPro plugins into reaperlegacy prefix"
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop: "{{ arch_reaper_legacy_vepro_plugin_links }}"

- name: "[{{ user_os }}] Wine tools: link VEPro runtime DLLs into reaperlegacy prefix"
  ansible.builtin.file:
    src: "{{ arch_music_plugins_wine_prefix }}/drive_c/windows/system32/{{ item }}"
    dest: "{{ arch_reaper_legacy_wine_setup.wine_prefix }}/drive_c/windows/system32/{{ item }}"
    state: link
    force: true
  loop: "{{ arch_reaper_wine_vepro_runtime_dlls }}"
