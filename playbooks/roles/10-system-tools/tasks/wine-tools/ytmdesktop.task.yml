---
- name: "[{{ user_os }}] Wine tools: stat ytmdesktop installer"
  ansible.builtin.stat:
    path: "{{ arch_ytmdesktop_wine_setup.backup_path }}/YouTube.Music.Desktop.App-{{ arch_ytmdesktop_wine_setup.version }}.Setup.exe"
  register: var_ytmdesktop_installer

- name: "[{{ user_os }}] Wine tools: get ytmdesktop"
  ansible.builtin.get_url:
    url: https://github.com/ytmdesktop/ytmdesktop/releases/download/v{{ arch_ytmdesktop_wine_setup.version }}/YouTube.Music.Desktop.App-{{
      arch_ytmdesktop_wine_setup.version }}.Setup.exe
    dest: "{{ arch_ytmdesktop_wine_setup.backup_path }}/YouTube.Music.Desktop.App-{{ arch_ytmdesktop_wine_setup.version }}.Setup.exe"
    mode: "755"
  ignore_errors: true
  register: var_new_ytmdesktop_version_downloaded
  when: not var_ytmdesktop_installer.stat.exists

- name: "[{{ user_os }}] Wine tools: stat ytmdesktop installed config"
  ansible.builtin.stat:
    path: "{{ arch_ytmdesktop_wine_setup.wine_prefix }}/drive_c/users/{{ ansible_facts.env.USER }}/AppData/Roaming/YouTube Music Desktop App/config.json"
  register: var_ytmdesktop_installed

- name: "[{{ user_os }}] Wine tools: check ytmdesktop installed version marker"
  ansible.builtin.include_role:
    name: dotfiles-markers
    tasks_from: check
  vars:
    dotfiles_marker_name: "ytmdesktop-installed-{{ arch_ytmdesktop_wine_setup.version }}"
    dotfiles_marker_register: var_ytmdesktop_install_marker

- name: "[{{ user_os }}] Wine tools: install ytmdesktop"
  ansible.builtin.command: >
    {{ ansible_facts.env.HOME }}/bin/wwine --prefix '{{ arch_ytmdesktop_wine_setup.wine_prefix }}'
    wine start /unix '{{ arch_ytmdesktop_wine_setup.backup_path }}/YouTube.Music.Desktop.App-{{ arch_ytmdesktop_wine_setup.version }}.Setup.exe'
  timeout: 60
  changed_when: true
  failed_when: false
  register: var_install_ytmdesktop
  when:
    - is_x_display_session
    - >
      (not var_ytmdesktop_installed.stat.exists)
      or
      (not var_ytmdesktop_install_marker.stat.exists)
    - >
      var_ytmdesktop_installer.stat.exists
      or
      (var_new_ytmdesktop_version_downloaded.changed | default(false))

- name: "[{{ user_os }}] Wine tools: stat ytmdesktop installed config after install"
  ansible.builtin.stat:
    path: "{{ arch_ytmdesktop_wine_setup.wine_prefix }}/drive_c/users/{{ ansible_facts.env.USER }}/AppData/Roaming/YouTube Music Desktop App/config.json"
  register: var_ytmdesktop_installed_after_install
  when: var_install_ytmdesktop.changed | default(false)

- name: "[{{ user_os }}] Wine tools: record ytmdesktop installed version marker"
  ansible.builtin.include_role:
    name: dotfiles-markers
    tasks_from: record
  vars:
    dotfiles_marker_name: "ytmdesktop-installed-{{ arch_ytmdesktop_wine_setup.version }}"
    dotfiles_marker_content: "{{ arch_ytmdesktop_wine_setup.version }}\n"
  when:
    - var_install_ytmdesktop.changed | default(false)
    - var_ytmdesktop_installed_after_install.stat.exists
