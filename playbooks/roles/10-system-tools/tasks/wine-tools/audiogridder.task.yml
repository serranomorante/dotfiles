---
- name: "[archlinux] Wine tools: get audiogridder server"
  ansible.builtin.unarchive:
    src: https://github.com/apohl79/audiogridder/releases/download/release_{{ arch_audiogridder_wine_setup.version_slug |
      default(arch_audiogridder_wine_setup.version) }}/AudioGridder_{{ arch_audiogridder_wine_setup.version }}-Windows-Installers.zip
    dest: "{{ arch_audiogridder_wine_setup.backup_path }}/"
    remote_src: true
  ignore_errors: true
  register: var_get_audiogridder_server

- name: "[archlinux] Wine tools: install audiogridder server"
  ansible.builtin.command: >
    {{ ansible_facts.env.HOME }}/bin/wwine --prefix musicplugins
    wine start /wait /unix '{{ arch_audiogridder_wine_setup.backup_path }}/AudioGridderServer_{{ arch_audiogridder_wine_setup.version }}.exe'
  timeout: 300
  failed_when: false
  args:
    creates: "{{ arch_audiogridder_wine_setup.wine_prefix }}/drive_c/Program Files/AudioGridderServer/AudioGridderServer.exe"
  when:
    - is_x_display_session
    - var_get_audiogridder_server is success
  register: var_install_audiogridder

- name: "[archlinux] Wine tools: close stale AudioGridder installer Wine processes"
  ansible.builtin.command: >
    {{ ansible_facts.env.HOME }}/bin/wwine --prefix musicplugins kill-prefix
  timeout: 60
  changed_when: true
  failed_when: false
  no_log: true
  when: var_install_audiogridder.changed | default(false)

- name: "[archlinux] Wine tools: stat audiogridder client marker"
  ansible.builtin.include_role:
    name: dotfiles-markers
    tasks_from: check
  vars:
    dotfiles_marker_name: "audiogridder-client-{{ arch_audiogridder_wine_setup.plugin_version }}"
    dotfiles_marker_register: var_audiogridder_client_marker

- name: "[archlinux] Wine tools: get audiogridder client"
  ansible.builtin.unarchive:
    src: https://audiogridder.com/github/releases/download/release_{{ arch_audiogridder_wine_setup.plugin_version_slug |
      default(arch_audiogridder_wine_setup.plugin_version) }}/AudioGridder_{{ arch_audiogridder_wine_setup.plugin_version }}-Linux.zip
    dest: ~/.vst3/
    remote_src: true
  timeout: 60
  ignore_errors: true
  register: var_get_audiogridder_client
  when: not var_audiogridder_client_marker.stat.exists

- name: "[archlinux] Wine tools: record audiogridder client marker"
  ansible.builtin.include_role:
    name: dotfiles-markers
    tasks_from: record
  vars:
    dotfiles_marker_name: "audiogridder-client-{{ arch_audiogridder_wine_setup.plugin_version }}"
    dotfiles_marker_content: "{{ arch_audiogridder_wine_setup.plugin_version }}\n"
  when: var_get_audiogridder_client is success and var_get_audiogridder_client.changed | default(false)

- name: "[archlinux] Wine tools: setup audiogridder.desktop file"
  ansible.builtin.template:
    src: audiogridder.desktop
    dest: ~/.local/share/applications/wine/Programs/AudioGridderServer.desktop
    mode: "644"
  notify: handler_update_desktop_database

- name: "[archlinux] Wine tools: setup launch-audiogridder-wine file"
  ansible.builtin.template:
    src: launch-audiogridder-wine
    dest: ~/.local/bin/launch-audiogridder-wine
    mode: "755"
