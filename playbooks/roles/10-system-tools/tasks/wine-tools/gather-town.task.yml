---
- name: "[{{ user_os }}] Wine tools: stat gather town installer"
  ansible.builtin.stat:
    path: "{{ arch_gather_wine_setup.backup_path }}/Gather-{{ arch_gather_wine_setup.version }}-Setup.exe"
  register: var_gather_town_installer

- name: "[{{ user_os }}] Wine tools: get gather town"
  ansible.builtin.get_url:
    url: https://downloads.gather.town/desktop/Gather-{{ arch_gather_wine_setup.version }}-Setup.exe
    dest: "{{ arch_gather_wine_setup.backup_path }}/"
    mode: "755"
  when: not var_gather_town_installer.stat.exists

- name: "[{{ user_os }}] Wine tools: install gather town"
  ansible.builtin.command: >
    {{ ansible_facts.env.HOME }}/bin/wwine --prefix '{{ arch_gather_wine_setup.wine_prefix }}'
    wine start /unix '{{ arch_gather_wine_setup.backup_path }}/Gather-{{ arch_gather_wine_setup.version }}-Setup.exe'
  timeout: 60
  args:
    creates: "{{ arch_gather_wine_setup.wine_prefix }}/drive_c/users/{{ ansible_facts.env.USER }}/AppData/Roaming/Gather/config.json"
  when: is_x_display_session
