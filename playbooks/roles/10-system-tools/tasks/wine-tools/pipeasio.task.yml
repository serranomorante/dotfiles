---
- name: "[archlinux] Wine tools: check pipeasio package"
  ansible.builtin.command:
    argv:
      - pacman
      - -Q
      - pipeasio
  changed_when: false
  failed_when: false
  register: var_pipeasio_package

- name: "[archlinux] Wine tools: check pipeasio registration marker"
  ansible.builtin.include_role:
    name: dotfiles-markers
    tasks_from: check
  vars:
    dotfiles_marker_name: pipeasio-registered-reaper
    dotfiles_marker_register: var_pipeasio_registration_marker
    dotfiles_marker_read: true
  when: var_pipeasio_package.rc == 0

- name: "[archlinux] Wine tools: require reaper system wine profile for pipeasio"
  ansible.builtin.assert:
    that:
      - (wwine_prefix_aliases.reaper.wine_profile | default('system')) == 'system'
    fail_msg: "PipeASIO is only managed for arch_reaper_wine_setup with the reaper alias on the system Wine profile."
  when: var_pipeasio_package.rc == 0

- name: "[archlinux] Wine tools: set pipeasio registration profile"
  ansible.builtin.set_fact:
    var_pipeasio_reaper_wine_profile: system
    var_pipeasio_reaper_pipeasio_prefix: /usr
    var_pipeasio_reaper_pipeasio_lib: /usr/lib/wine
    var_pipeasio_registration_marker_content: "{{ var_pipeasio_package.stdout }} reaper {{ arch_reaper_wine_setup.wine_prefix }} profile system pipeasio-prefix /usr\n"
  when: var_pipeasio_package.rc == 0

- name: "[archlinux] Wine tools: parse installed pipeasio package version"
  ansible.builtin.set_fact:
    var_pipeasio_package_version: "{{ (var_pipeasio_package.stdout | regex_search('^pipeasio\\s+([^\\s]+)', '\\1') | default([''], true) | first) }}"
  when: var_pipeasio_package.rc == 0

- name: "[archlinux] Wine tools: read pipeasio registration marker content"
  ansible.builtin.set_fact:
    var_pipeasio_registration_marker_text: "{{ (var_pipeasio_registration_marker.content | default('') | b64decode) if var_pipeasio_registration_marker.stat.exists else '' }}"
  when: var_pipeasio_package.rc == 0

- name: "[archlinux] Wine tools: parse registered pipeasio package version"
  ansible.builtin.set_fact:
    var_pipeasio_registered_package_version: "{{ (var_pipeasio_registration_marker_text | regex_search('^pipeasio\\s+([^\\s]+)', '\\1') | default([''], true) | first) }}"
  when: var_pipeasio_package.rc == 0

- name: "[archlinux] Wine tools: stat arch pipeasio dll"
  ansible.builtin.stat:
    path: "{{ var_pipeasio_reaper_pipeasio_lib }}/x86_64-windows/pipeasio64.dll"
    checksum_algorithm: sha256
  register: var_pipeasio_arch_dll
  when: var_pipeasio_package.rc == 0

- name: "[archlinux] Wine tools: stat reaper prefix pipeasio dll"
  ansible.builtin.stat:
    path: "{{ arch_reaper_wine_setup.wine_prefix }}/drive_c/windows/system32/pipeasio64.dll"
    checksum_algorithm: sha256
  register: var_pipeasio_prefix_dll
  when: var_pipeasio_package.rc == 0

- name: "[archlinux] Wine tools: warn when reaper prefix pipeasio is stale"
  dotfiles_health_event:
    severity: warning
    event_type: pipeasio_prefix_stale
    msg: "PipeASIO package {{ var_pipeasio_package.stdout }} does not match the REAPER prefix state for {{ arch_reaper_wine_setup.wine_prefix }}: installed version={{ var_pipeasio_package_version | default('missing', true) }}, registered marker={{ var_pipeasio_registered_package_version | default('missing', true) }}, arch dll sha256={{ var_pipeasio_arch_dll.stat.checksum | default('missing') }}, prefix dll sha256={{ var_pipeasio_prefix_dll.stat.checksum | default('missing') }}. The pipeasio task will restage/register the current package."
  when:
    - var_pipeasio_package.rc == 0
    - >
      (
        var_pipeasio_registration_marker.stat.exists
        and (var_pipeasio_registered_package_version | default('')) != ''
        and (var_pipeasio_registered_package_version | default('')) != (var_pipeasio_package_version | default(''))
      )
      or
      (
        var_pipeasio_registration_marker.stat.exists
        and not var_pipeasio_prefix_dll.stat.exists
      )
      or
      (
        var_pipeasio_arch_dll.stat.exists
        and var_pipeasio_prefix_dll.stat.exists
        and var_pipeasio_arch_dll.stat.checksum != var_pipeasio_prefix_dll.stat.checksum
      )

- name: "[archlinux] Wine tools: set pipeasio registration environment"
  ansible.builtin.set_fact:
    var_pipeasio_registration_env: "{{ wine_env_profiles.get(var_pipeasio_reaper_wine_profile, wine_env_vars) | combine({ 'WINEPREFIX': arch_reaper_wine_setup.wine_prefix, 'WINEARCH': arch_reaper_wine_setup.architecture | default('win64'), 'PIPEASIO_PREFIX': var_pipeasio_reaper_pipeasio_prefix, 'WINEDLLPATH': var_pipeasio_reaper_pipeasio_lib ~ (((wine_env_profiles.get(var_pipeasio_reaper_wine_profile, wine_env_vars).WINEDLLPATH | default('')) | length > 0) | ternary(':' ~ wine_env_profiles.get(var_pipeasio_reaper_wine_profile, wine_env_vars).WINEDLLPATH, '')) }) }}"
  when: var_pipeasio_package.rc == 0

- name: "[archlinux] Wine tools: stage pipeasio in reaper prefix"
  ansible.builtin.copy:
    src: "{{ var_pipeasio_reaper_pipeasio_lib }}/x86_64-windows/pipeasio64.dll"
    dest: "{{ arch_reaper_wine_setup.wine_prefix }}/drive_c/windows/system32/pipeasio64.dll"
    remote_src: true
    mode: "0644"
  when: var_pipeasio_package.rc == 0

- name: "[archlinux] Wine tools: register pipeasio silently in reaper prefix"
  ansible.builtin.command:
    argv:
      - wine
      - regsvr32
      - /s
      - pipeasio64.dll
  environment: "{{ var_pipeasio_registration_env }}"
  changed_when: var_pipeasio_register_result.rc == 0
  failed_when: var_pipeasio_register_result.rc != 0
  register: var_pipeasio_register_result
  when:
    - var_pipeasio_package.rc == 0
    - >
      (not var_pipeasio_registration_marker.stat.exists) or
      ((var_pipeasio_registration_marker.content | default('') | b64decode) != var_pipeasio_registration_marker_content)

- name: "[archlinux] Wine tools: set pipeasio registration state"
  ansible.builtin.set_fact:
    var_pipeasio_registration_active: >-
      {{
        (var_pipeasio_register_result.rc | default(-1) == 0)
        or
        (
          var_pipeasio_registration_marker.stat.exists
          and
          ((var_pipeasio_registration_marker.content | default('') | b64decode) == var_pipeasio_registration_marker_content)
        )
      }}
  when: var_pipeasio_package.rc == 0

- name: "[archlinux] Wine tools: mark pipeasio registered"
  ansible.builtin.include_role:
    name: dotfiles-markers
    tasks_from: record
  vars:
    dotfiles_marker_name: pipeasio-registered-reaper
    dotfiles_marker_content: "{{ var_pipeasio_registration_marker_content }}"
  when:
    - var_pipeasio_package.rc == 0
    - var_pipeasio_register_result is defined
    - var_pipeasio_register_result.rc | default(-1) == 0
    - >
      (not var_pipeasio_registration_marker.stat.exists) or
      ((var_pipeasio_registration_marker.content | default('') | b64decode) != var_pipeasio_registration_marker_content)

- name: "[archlinux] Wine tools: stat wine reaper ini for pipeasio"
  ansible.builtin.stat:
    path: "{{ arch_reaper_wine_setup.wine_prefix }}/drive_c/users/{{ ansible_facts.env.USER }}/AppData/Roaming/REAPER/REAPER.ini"
  register: var_pipeasio_reaper_ini
  when:
    - var_pipeasio_package.rc == 0
    - var_pipeasio_registration_active | default(false)
    - arch_pipeasio_setup.configure_reaper | default(false) | bool

- name: "[archlinux] Wine tools: configure wine reaper for pipeasio"
  ansible.builtin.lineinfile:
    path: "{{ arch_reaper_wine_setup.wine_prefix }}/drive_c/users/{{ ansible_facts.env.USER }}/AppData/Roaming/REAPER/REAPER.ini"
    regexp: "^{{ item.key }}=.*"
    line: "{{ item.key }}={{ item.value }}"
    insertafter: "^\\[audioconfig\\]"
  loop:
    - key: mode
      value: "{{ arch_wineasio_setup.reaper_audio_mode }}"
    - key: asio_driver_name
      value: '"PipeASIO Driver"'
    - key: asio_input0
      value: "0"
    - key: asio_input1
      value: "1"
    - key: asio_output0
      value: "0"
    - key: asio_output1
      value: "1"
    - key: asio_srate
      value: "{{ arch_wineasio_setup.reaper_sample_rate }}"
    - key: asio_srate_use
      value: "1"
    - key: asio_bsize
      value: "{{ arch_wineasio_setup.reaper_block_size }}"
    - key: asio_bsize_use
      value: "1"
  when:
    - var_pipeasio_package.rc == 0
    - var_pipeasio_registration_active | default(false)
    - arch_pipeasio_setup.configure_reaper | default(false) | bool
    - var_pipeasio_reaper_ini.stat.exists
