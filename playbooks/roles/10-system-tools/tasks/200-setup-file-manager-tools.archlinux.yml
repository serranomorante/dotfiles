---
- name: "[archlinux] Setup file manager: clone packages"
  ansible.builtin.include_role:
    name: update-diff-capture
    tasks_from: git
  vars:
    update_diff_capture_scope: file-manager-tools
    update_diff_git_repo: "{{ item.repo }}"
    update_diff_git_dest: "{{ ansible_facts.env.HOME }}/data/repos/{{ item.name | default(item.repo) | basename }}"
    update_diff_git_depth: 10
    update_diff_git_force: true
    update_diff_git_single_branch: true
    update_diff_git_version: "{{ item.version | default('HEAD') }}"
  loop:
    - { repo: https://github.com/jarun/nnn, version: v5.2 }
  register: var_nnn_repo

- name: "[archlinux] Setup file manager: ensure deps"
  become: true
  ansible.builtin.package:
    state: present
    name:
      - eza
      - pkg-config
      - ncurses
      - imagemagick
      - chafa
      - readline
      - mpv
      - ffmpegthumbnailer
      - ffmpeg
      - sshfs
      - poppler
      - udisks2
      - e2fsprogs
      - ntfs-3g
      - ueberzug
      - lowdown
      - fuse2
      - dragon
      - libimobiledevice
      - usbmuxd
      - gnome-epub-thumbnailer

- name: "[archlinux] Setup file manager: ensure local AUR deps"
  ansible.builtin.include_tasks: "{{ ansible_facts.env.HOME }}/dotfiles/playbooks/roles/10-system-tools/tasks/install-local-aur-packages.archlinux.yml"
  vars:
    aur_local_packages:
      - pmount
      - xdg-desktop-portal-termfilechooser-hunkyburrito-git
    aur_local_package_notify:
      - handler_restart_xdg_desktop_portal_termfilechooser

- name: "[archlinux] Setup file manager: check nnn binary"
  ansible.builtin.stat:
    path: ~/.local/bin/nnn
  register: var_nnn_binary

- name: "[archlinux] Setup file manager: build nnn"
  ansible.builtin.command: make O_NERD=1 O_GITSTATUS=1 O_PCRE2=1 strip install
  environment:
    PREFIX: "{{ ansible_facts.env.HOME }}/.local"
  args:
    chdir: ~/data/repos/nnn
  when: var_nnn_repo is changed or not var_nnn_binary.stat.exists

- name: "[archlinux] Setup file manager: ensure dest folder"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "744"
  loop:
    - ~/.config/nnn
    - ~/.config/nnn/plugins

# https://github.com/jarun/nnn/wiki/Advanced-use-cases#desktop-integration
- name: "[archlinux] Setup file manager: install nnn plugins"
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
  loop:
    - src: ~/data/repos/nnn/plugins/preview-tui
      dest: ~/.config/nnn/plugins/preview-tui
    - src: ~/dotfiles/assets/scripts/nnn/nmount
      dest: ~/.config/nnn/plugins/nmount
    - src: ~/data/repos/nnn/plugins/umounttree
      dest: ~/.config/nnn/plugins/umounttree
    - src: ~/data/repos/nnn/plugins/dragdrop
      dest: ~/.config/nnn/plugins/dragdrop

# https://github.com/jarun/nnn/wiki/Advanced-use-cases#desktop-integration
- name: "[archlinux] Setup file manager: install nnn plugins"
  ansible.builtin.copy:
    src: ~/data/repos/nnn/misc/desktop/nnn.desktop
    dest: ~/.local/share/applications/nnn.desktop
    mode: "644"

- name: "[archlinux] Setup file manager: get nnn external plugin"
  ansible.builtin.copy:
    dest: ~/.config/nnn/plugins/cdto
    content: |
      #!/usr/bin/env sh
      printf "cd to: "
      read -r dir
      printf "%s" "0c$dir" > "$NNN_PIPE"
    mode: "755"

# Enforce persistent filesystem labels on connect. A udev rule matches the
# configured UUIDs and hands off to dotfiles-fs-label@<uuid>.service, which
# unmounts (if needed) and relabels the volume when its label drifted.
- name: "[archlinux] Setup file manager: install fs-label helper"
  become: true
  ansible.builtin.copy:
    src: ~/dotfiles/assets/scripts/storage/dotfiles-set-fs-label
    dest: /usr/local/bin/dotfiles-set-fs-label
    owner: root
    mode: "755"

- name: "[archlinux] Setup file manager: ensure fs-label config dir"
  become: true
  ansible.builtin.file:
    path: /etc/dotfiles
    state: directory
    owner: root
    mode: "755"

- name: "[archlinux] Setup file manager: write fs-label config"
  become: true
  ansible.builtin.copy:
    dest: /etc/dotfiles/fs-labels.conf
    owner: root
    mode: "644"
    content: |
      # {{ ansible_managed }}
      # Managed by 10-200 (arch_filesystem_autolabels). "<uuid> <label>" per line.
      {% for entry in arch_filesystem_autolabels %}
      {{ entry.uuid }} {{ entry.label }}
      {% endfor %}

- name: "[archlinux] Setup file manager: install fs-label service unit"
  become: true
  ansible.builtin.template:
    src: "{{ ansible_facts.env.HOME }}/dotfiles/assets/services/dotfiles-fs-label@.service"
    dest: /etc/systemd/system/dotfiles-fs-label@.service
    owner: root
    mode: "644"
  notify: "10-system-tools : handler_reload_systemd"

- name: "[archlinux] Setup file manager: install fs-label udev rule"
  become: true
  ansible.builtin.template:
    src: 70-dotfiles-fs-label.rules
    dest: /etc/udev/rules.d/70-dotfiles-fs-label.rules
    owner: root
    mode: "644"
  notify: "10-system-tools : handler_reload_udev_rules"

# Allow the local user to mount/unmount/eject via udisks2 without a password,
# so the nmount plugin can toggle volumes (including pmount-created /media
# mounts) the same way the desktop file manager does. polkitd auto-reloads
# rules.d, so the rule takes effect on the next authorization check.
- name: "[archlinux] Setup file manager: install udisks2 polkit rule"
  become: true
  ansible.builtin.template:
    src: 49-dotfiles-udisks2.rules
    dest: /etc/polkit-1/rules.d/49-dotfiles-udisks2.rules
    owner: root
    mode: "644"
