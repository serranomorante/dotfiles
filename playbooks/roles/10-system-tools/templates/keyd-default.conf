# Latin characters go through xdotool rather than compose macros. xdotool binds
# the target keysym to a spare keycode before sending it, so it also reaches
# applications that ignore the XCompose sequences macro(compose a ') depends on.
# Applications where the compose route is the better one are overridden per
# application in ~/.config/keyd/app.conf by keyd-application-mapper.
# --clearmodifiers matters in [spanish+shift] too: without it the physical shift
# stays down and the application reads the injected keycode at its shift level.
# --no-login skips the ~130 ms login shell. X autorepeat here starts at 190 ms
# (mouseless sets `xset r rate 190 50`) and oneshot_timeout is 1000 ms, so a
# slow command lets one held key emit a run of accented characters.
{% set xdotool_key = "/usr/local/bin/run_as_user -n -u " ~ ansible_facts.env.USER ~ " /usr/bin/xdotool key --clearmodifiers" %}

[spanish]
a = command({{ xdotool_key }} aacute)
e = command({{ xdotool_key }} eacute)
i = command({{ xdotool_key }} iacute)
o = command({{ xdotool_key }} oacute)
u = command({{ xdotool_key }} uacute)
n = command({{ xdotool_key }} ntilde)

[spanish+shift]
a = command({{ xdotool_key }} Aacute)
e = command({{ xdotool_key }} Eacute)
i = command({{ xdotool_key }} Iacute)
o = command({{ xdotool_key }} Oacute)
u = command({{ xdotool_key }} Uacute)
n = command({{ xdotool_key }} Ntilde)
1 = command({{ xdotool_key }} exclamdown)
4 = command({{ xdotool_key }} EuroSign)
/ = command({{ xdotool_key }} questiondown)

# Same output as [spanish+shift], reached through ctrl+shift+space instead of
# holding shift over the oneshot layer. Kept so both habits keep working.
[spanish_upper]
a = command({{ xdotool_key }} Aacute)
e = command({{ xdotool_key }} Eacute)
i = command({{ xdotool_key }} Iacute)
o = command({{ xdotool_key }} Oacute)
u = command({{ xdotool_key }} Uacute)
n = command({{ xdotool_key }} Ntilde)
1 = command({{ xdotool_key }} exclamdown)
4 = command({{ xdotool_key }} EuroSign)
/ = command({{ xdotool_key }} questiondown)
