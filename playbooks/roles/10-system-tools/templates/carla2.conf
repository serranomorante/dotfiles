; {{ ansible_managed }}
;
; VST2/VST3 search paths deliberately exclude ~/.vst and ~/.vst3 so yabridge's
; bridged .so wrappers do not show up in Carla's own plugin browser; only the
; native system dirs and the VEP bridge folders are scanned.
{% set vst2_paths = [
  '/usr/lib/vst',
  '/usr/local/lib/vst',
  arch_reaper_wine_setup.wine_prefix ~ '/drive_c/reaper-vst-bridge/vepro/VST2',
] %}
{% set vst3_paths = [
  '/usr/lib/vst3',
  '/usr/local/lib/vst3',
  arch_reaper_wine_setup.wine_prefix ~ '/drive_c/reaper-vst-bridge/vepro/VST3',
] %}

[Paths]
VST2={{ vst2_paths | join(',') }}
VST3={{ vst3_paths | join(',') }}

[Wine]
Executable={{ wine_env_profiles.system.WINELOADER }}
AutoPrefix=true
FallbackPrefix={{ arch_reaper_wine_setup.wine_prefix }}

# The master experimental toggle must be on too: when it is off, Carla's
# settings dialog calls resetExperimentalSettings() on save, which reverts
# PluginBridges/WineBridges to false and hides the Wine settings tab.
[Main]
Experimental=true

[Experimental]
PluginBridges=true
WineBridges=true
