---
audio_latency_buffer_size: 256
audio_latency_sample_rate: 48000

pipewire_latency_vars:
  PIPEWIRE_LATENCY: "{{ audio_latency_buffer_size }}/{{ audio_latency_sample_rate }}"
  PIPEWIRE_QUANTUM: "{{ audio_latency_buffer_size }}/{{ audio_latency_sample_rate }}"
  PIPEWIRE_RATE: "1/{{ audio_latency_sample_rate }}"

arch_wineasio_setup:
  repo: https://github.com/wineasio/wineasio
  repo_path: "{{ ansible_facts.env.HOME }}/data/repos/wineasio"
  version: master
  number_inputs: 2
  number_outputs: 2
  autostart_server: 0
  connect_to_hardware: 1
  fixed_buffersize: 1
  reaper_block_size: "{{ audio_latency_buffer_size }}"
  reaper_sample_rate: "{{ audio_latency_sample_rate }}"

arch_reaper_wine_audio_device: wineasio
arch_reaper_wine_audio_devices:
  dummy:
    description: "REAPER Dummy Audio; no real audio device, useful for isolating backend crashes."
    mode: 0
  waveout:
    description: "Windows WaveOut compatibility backend."
    mode: 1
  directsound:
    description: "Windows DirectSound backend."
    mode: 2
  wineasio:
    description: "ASIO through WineASIO and PipeWire JACK."
    mode: 3
    asio_driver: 1
    asio_driver_name: WineASIO Driver
  pipeasio:
    description: "ASIO through PipeASIO and PipeWire."
    mode: 3
    asio_driver: 2
    asio_driver_name: PipeASIO Driver
  wdm_kernel_streaming:
    description: "Windows WDM Kernel Streaming backend."
    mode: 4
  wasapi:
    description: "Windows WASAPI backend."
    mode: 5

arch_pipeasio_setup:
  configure_reaper: false

arch_reaper_sws_extension_setup:
  version: 2.14.0.7
  backup_path: ~/data/Downloads/music-production

arch_helgobox_setup:
  version: 2.18.2
  backup_path: ~/data/Downloads/music-production
  linux_vst_name: helgobox-linux-x86_64.so
  linux_vst_checksum: sha256:b23e9a8b6471551a073327bac2f045d6ad296bb593b7157cc944fc4b4e8a5a6e
  linux_reaper_extension_name: reaper_helgobox-linux-x86_64.so
  linux_reaper_extension_checksum: sha256:bd2e44616f3ffd64a3c0f349b4276e17abf214012486a5f49277c632d40f068f
  windows_vst_name: helgobox-windows-x86_64.dll
  windows_vst_checksum: sha256:54b6a207e66da17fec8c10675fb6df62047f0ebd77255c432391c5e906c76ed7
  windows_reaper_extension_name: reaper_helgobox-windows-x86_64.dll
  windows_reaper_extension_checksum: sha256:cac64a684321737e3baa73b297faf179a29588f1d9bdf9e8ce7f7cad021c8e79

arch_yabridge_version: 5.1.1

arch_linvstx_setup:
  version: "4.9"
  archive_name: LinVst-X-4.9-wine-10.x-arch.zip
  archive_url: https://github.com/osxmidi/LinVst-X/releases/download/4.9/LinVst-X-4.9-wine-10.x-arch.zip
  archive_checksum: sha256:291d9f897cf8711a734fc760ab6ec409e1a8446ebe5a554044d8ef3ed10ef78e
  install_parent_path: "{{ ansible_facts.env.HOME }}/.local/share"
  install_path: "{{ ansible_facts.env.HOME }}/.local/share/LinVst-X-4.9-wine-10.x-arch"
  linvstx_so_path: "{{ ansible_facts.env.HOME }}/.local/share/LinVst-X-4.9-wine-10.x-arch/linvstx.so"

# Carla Windows bridge binaries. The Arch carla package ships without them, so
# they are cross-compiled directly from the matching Carla tag instead of via a
# (stale) AUR package whose 32-bit build no longer works against the current
# mingw-w64 toolchain.
arch_carla_bridge_setup:
  repo: https://github.com/falkTX/Carla
  version: ad09259060a4e660a5033024406a1c3cc9f9c198  # refs/tags/v2.5.10, matches installed carla
  source_path: "{{ ansible_facts.env.HOME }}/data/repos/carla-bridges"
  install_path: /usr/lib/carla
  bridge_name: carla-bridge-win64.exe
  discovery_name: carla-discovery-win64.exe
  dll_name: jackbridge-wine64.dll

wwine_prefix_aliases:
  musicproduction:
    path: "{{ arch_musicproduction_wine_prefix }}"
    architecture: win64
    wine_profile: system
  reaper:
    path: "{{ arch_reaper_wine_setup.wine_prefix }}"
    architecture: "{{ arch_reaper_wine_setup.architecture | default('win64') }}"
    sandbox_profile: "{{ ansible_facts.env.HOME }}/.config/firejail/wine-reaper.local"
    sandbox_check_profile: "{{ ansible_facts.env.HOME }}/.local/share/wwine/firejail-profiles/wine-reaper.local"
    sandbox_name: wwine-reaper
    wine_profile: system
  musicplugins:
    path: "{{ arch_music_plugins_wine_prefix }}"
    architecture: win64
    sandbox_profile: "{{ ansible_facts.env.HOME }}/.config/firejail/wine-reaper.local"
    sandbox_check_profile: "{{ ansible_facts.env.HOME }}/.local/share/wwine/firejail-profiles/wine-reaper.local"
    sandbox_name: wwine-reaper
    wine_profile: legacy
  reaperlegacy:
    path: "{{ arch_reaper_legacy_wine_setup.wine_prefix }}"
    architecture: "{{ arch_reaper_legacy_wine_setup.architecture | default('win64') }}"
    sandbox_profile: "{{ ansible_facts.env.HOME }}/.config/firejail/wine-reaper.local"
    sandbox_check_profile: "{{ ansible_facts.env.HOME }}/.local/share/wwine/firejail-profiles/wine-reaper.local"
    sandbox_name: wwine-reaper
    wine_profile: legacy
  studioone:
    path: "{{ arch_studio_one_wine_setup.wine_prefix }}"
    architecture: "{{ arch_studio_one_wine_setup.architecture | default('win64') }}"
    sandbox_profile: "{{ ansible_facts.env.HOME }}/.config/firejail/wine-reaper.local"
    sandbox_check_profile: "{{ ansible_facts.env.HOME }}/.local/share/wwine/firejail-profiles/wine-reaper.local"
    sandbox_name: wwine-reaper
    wine_profile: system
  synthv:
    path: "{{ arch_synthv_wine_prefix }}"
    architecture: win64

arch_reaper_wine_prefix: "{{ ansible_facts.env.HOME }}/data/.wine-win64-windows-reaper"
arch_reaper_wine_drive_c: "{{ arch_reaper_wine_prefix }}/drive_c"
arch_music_plugins_wine_prefix: "{{ ansible_facts.env.HOME }}/data/.wine-win64-legacy-reaper"
arch_music_plugins_wine_drive_c: "{{ arch_music_plugins_wine_prefix }}/drive_c"
arch_reaper_legacy_wine_prefix: "{{ ansible_facts.env.HOME }}/data/.wine-win64-reaper-legacy"
arch_reaper_legacy_wine_drive_c: "{{ arch_reaper_legacy_wine_prefix }}/drive_c"
arch_synthv_wine_prefix: "{{ ansible_facts.env.HOME }}/data/.wine-win64-synthv2"
arch_musicproduction_wine_prefix: "{{ ansible_facts.env.HOME }}/data/.wine-win64-musicproduction"
arch_studio_one_wine_prefix: "{{ ansible_facts.env.HOME }}/data/.wine-win64-studio-one"
arch_studio_one_wine_drive_c: "{{ arch_studio_one_wine_prefix }}/drive_c"

arch_reaper_wine_setup:
  version: "779"
  backup_path: ~/data/Downloads/music-production
  wine_prefix: "{{ arch_reaper_wine_prefix }}"
  architecture: win64 # wow64 will fail for some plugins

arch_reaper_legacy_wine_setup:
  wine_prefix: "{{ arch_reaper_legacy_wine_prefix }}"
  architecture: win64

arch_studio_one_wine_setup:
  wine_prefix: "{{ arch_studio_one_wine_prefix }}"
  architecture: win64
  installer_path: "{{ ansible_facts.env.HOME }}/Downloads/PreSonus Studio One 5 Installer.exe"

arch_reaper_wine_vepro_bridge_path: "{{ arch_reaper_wine_setup.wine_prefix }}/drive_c/reaper-vst-bridge/vepro"

arch_reaper_wine_vepro_plugin_links:
  - src: "{{ arch_music_plugins_wine_prefix }}/drive_c/Program Files/Common Files/VST2/Vienna Ensemble Pro Audio Input x64.dll"
    dest: "{{ arch_reaper_wine_vepro_bridge_path }}/VST2/Vienna Ensemble Pro Audio Input x64.dll"
  - src: "{{ arch_music_plugins_wine_prefix }}/drive_c/Program Files/Common Files/VST2/Vienna Ensemble Pro Event Input x64.dll"
    dest: "{{ arch_reaper_wine_vepro_bridge_path }}/VST2/Vienna Ensemble Pro Event Input x64.dll"
  - src: "{{ arch_music_plugins_wine_prefix }}/drive_c/Program Files/Common Files/VST2/Vienna Ensemble Pro Surround x64.dll"
    dest: "{{ arch_reaper_wine_vepro_bridge_path }}/VST2/Vienna Ensemble Pro Surround x64.dll"
  - src: "{{ arch_music_plugins_wine_prefix }}/drive_c/Program Files/Common Files/VST2/Vienna Ensemble Pro x64.dll"
    dest: "{{ arch_reaper_wine_vepro_bridge_path }}/VST2/Vienna Ensemble Pro x64.dll"
  - src: "{{ arch_music_plugins_wine_prefix }}/drive_c/Program Files/Common Files/VST3/Vienna Ensemble Pro Audio Input x64.vst3"
    dest: "{{ arch_reaper_wine_vepro_bridge_path }}/VST3/Vienna Ensemble Pro Audio Input x64.vst3"
  - src: "{{ arch_music_plugins_wine_prefix }}/drive_c/Program Files/Common Files/VST3/Vienna Ensemble Pro Event Input x64.vst3"
    dest: "{{ arch_reaper_wine_vepro_bridge_path }}/VST3/Vienna Ensemble Pro Event Input x64.vst3"
  - src: "{{ arch_music_plugins_wine_prefix }}/drive_c/Program Files/Common Files/VST3/Vienna Ensemble Pro Surround x64.vst3"
    dest: "{{ arch_reaper_wine_vepro_bridge_path }}/VST3/Vienna Ensemble Pro Surround x64.vst3"
  - src: "{{ arch_music_plugins_wine_prefix }}/drive_c/Program Files/Common Files/VST3/Vienna Ensemble Pro x64.vst3"
    dest: "{{ arch_reaper_wine_vepro_bridge_path }}/VST3/Vienna Ensemble Pro x64.vst3"

# Vienna Ensemble Pro plugin bridge for the Windows Studio One prefix. Unlike the
# REAPER bridge, these land in the standard Common Files VST paths so the native
# Windows Studio One scanner picks them up directly.
arch_studio_one_vepro_plugin_links:
  - src: "{{ arch_music_plugins_wine_prefix }}/drive_c/Program Files/Common Files/VST2/Vienna Ensemble Pro Audio Input x64.dll"
    dest: "{{ arch_studio_one_wine_drive_c }}/Program Files/Common Files/VST2/Vienna Ensemble Pro Audio Input x64.dll"
  - src: "{{ arch_music_plugins_wine_prefix }}/drive_c/Program Files/Common Files/VST2/Vienna Ensemble Pro Event Input x64.dll"
    dest: "{{ arch_studio_one_wine_drive_c }}/Program Files/Common Files/VST2/Vienna Ensemble Pro Event Input x64.dll"
  - src: "{{ arch_music_plugins_wine_prefix }}/drive_c/Program Files/Common Files/VST2/Vienna Ensemble Pro Surround x64.dll"
    dest: "{{ arch_studio_one_wine_drive_c }}/Program Files/Common Files/VST2/Vienna Ensemble Pro Surround x64.dll"
  - src: "{{ arch_music_plugins_wine_prefix }}/drive_c/Program Files/Common Files/VST2/Vienna Ensemble Pro x64.dll"
    dest: "{{ arch_studio_one_wine_drive_c }}/Program Files/Common Files/VST2/Vienna Ensemble Pro x64.dll"
  - src: "{{ arch_music_plugins_wine_prefix }}/drive_c/Program Files/Common Files/VST3/Vienna Ensemble Pro Audio Input x64.vst3"
    dest: "{{ arch_studio_one_wine_drive_c }}/Program Files/Common Files/VST3/Vienna Ensemble Pro Audio Input x64.vst3"
  - src: "{{ arch_music_plugins_wine_prefix }}/drive_c/Program Files/Common Files/VST3/Vienna Ensemble Pro Event Input x64.vst3"
    dest: "{{ arch_studio_one_wine_drive_c }}/Program Files/Common Files/VST3/Vienna Ensemble Pro Event Input x64.vst3"
  - src: "{{ arch_music_plugins_wine_prefix }}/drive_c/Program Files/Common Files/VST3/Vienna Ensemble Pro Surround x64.vst3"
    dest: "{{ arch_studio_one_wine_drive_c }}/Program Files/Common Files/VST3/Vienna Ensemble Pro Surround x64.vst3"
  - src: "{{ arch_music_plugins_wine_prefix }}/drive_c/Program Files/Common Files/VST3/Vienna Ensemble Pro x64.vst3"
    dest: "{{ arch_studio_one_wine_drive_c }}/Program Files/Common Files/VST3/Vienna Ensemble Pro x64.vst3"

arch_reaper_legacy_vepro_bridge_path: "{{ arch_reaper_legacy_wine_setup.wine_prefix }}/drive_c/reaper-vst-bridge/vepro"

arch_reaper_legacy_vepro_plugin_links:
  - src: "{{ arch_music_plugins_wine_prefix }}/drive_c/Program Files/Common Files/VST2/Vienna Ensemble Pro Audio Input x64.dll"
    dest: "{{ arch_reaper_legacy_vepro_bridge_path }}/VST2/Vienna Ensemble Pro Audio Input x64.dll"
  - src: "{{ arch_music_plugins_wine_prefix }}/drive_c/Program Files/Common Files/VST2/Vienna Ensemble Pro Event Input x64.dll"
    dest: "{{ arch_reaper_legacy_vepro_bridge_path }}/VST2/Vienna Ensemble Pro Event Input x64.dll"
  - src: "{{ arch_music_plugins_wine_prefix }}/drive_c/Program Files/Common Files/VST2/Vienna Ensemble Pro Surround x64.dll"
    dest: "{{ arch_reaper_legacy_vepro_bridge_path }}/VST2/Vienna Ensemble Pro Surround x64.dll"
  - src: "{{ arch_music_plugins_wine_prefix }}/drive_c/Program Files/Common Files/VST2/Vienna Ensemble Pro x64.dll"
    dest: "{{ arch_reaper_legacy_vepro_bridge_path }}/VST2/Vienna Ensemble Pro x64.dll"
  - src: "{{ arch_music_plugins_wine_prefix }}/drive_c/Program Files/Common Files/VST3/Vienna Ensemble Pro Audio Input x64.vst3"
    dest: "{{ arch_reaper_legacy_vepro_bridge_path }}/VST3/Vienna Ensemble Pro Audio Input x64.vst3"
  - src: "{{ arch_music_plugins_wine_prefix }}/drive_c/Program Files/Common Files/VST3/Vienna Ensemble Pro Event Input x64.vst3"
    dest: "{{ arch_reaper_legacy_vepro_bridge_path }}/VST3/Vienna Ensemble Pro Event Input x64.vst3"
  - src: "{{ arch_music_plugins_wine_prefix }}/drive_c/Program Files/Common Files/VST3/Vienna Ensemble Pro Surround x64.vst3"
    dest: "{{ arch_reaper_legacy_vepro_bridge_path }}/VST3/Vienna Ensemble Pro Surround x64.vst3"
  - src: "{{ arch_music_plugins_wine_prefix }}/drive_c/Program Files/Common Files/VST3/Vienna Ensemble Pro x64.vst3"
    dest: "{{ arch_reaper_legacy_vepro_bridge_path }}/VST3/Vienna Ensemble Pro x64.vst3"

arch_reaper_wine_vepro_runtime_dlls:
  - DNSVEP.dll
  - Servus.dll
  - veplugin_shared.dll

arch_reaper_wine_vepro_vst_paths:
  - 'C:\reaper-vst-bridge\vepro\VST2'
  - 'C:\reaper-vst-bridge\vepro\VST3'

arch_reaper_wine_obsolete_vst_path_regexes:
  - '(^|[\\/])\.wine-win64-reaper([\\/]|$)'

arch_audiogridder_wine_setup:
  version: 1.1.1
  version_slug: "1_1_1"
  plugin_version: 1.1.1
  plugin_version_slug: "1_1_1"
  backup_path: ~/data/Downloads/music-production
  config_path: "{{ arch_music_plugins_wine_prefix }}/drive_c/users/{{ ansible_facts.env.USER }}/AppData/Roaming/AudioGridder"
  wine_prefix: "{{ arch_music_plugins_wine_prefix }}"
