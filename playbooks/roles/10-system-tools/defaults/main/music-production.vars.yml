---
pipewire_latency_vars:
  PIPEWIRE_LATENCY: "512/48000"
  PIPEWIRE_QUANTUM: "512/48000"
  PIPEWIRE_RATE: "1/48000"

arch_wineasio_setup:
  repo: https://github.com/wineasio/wineasio
  repo_path: "{{ ansible_facts.env.HOME }}/data/repos/wineasio"
  version: master
  reaper_audio_mode: 2
  reaper_block_size: 512
  reaper_sample_rate: 48000

arch_pipeasio_setup:
  version: 1.2.1
  archive_url: https://github.com/M0n7y5/pipeasio/archive/refs/tags/v1.2.1.tar.gz
  archive_checksum: sha256:90ec9dd5d6d1170107f397a309c794b55c8f98e20e9bc1b35599ceddbbe3fcc9
  archive_path: "{{ ansible_facts.env.HOME }}/data/Downloads/music-production/pipeasio-1.2.1.tar.gz"
  source_path: "{{ ansible_facts.env.HOME }}/data/repos/pipeasio-1.2.1"
  build_path: "{{ ansible_facts.env.HOME }}/data/repos/pipeasio-1.2.1/build-wine-{{ arch_wine_staging_version }}"
  register_reaper_portable: false

arch_reaper_sws_extension_setup:
  version: 2.14.0.7
  backup_path: ~/data/Downloads/music-production

arch_helgobox_setup:
  version: 2.18.2
  backup_path: ~/data/Downloads/music-production
  linux_vst_name: helgobox-linux-x86_64.so
  linux_vst_checksum: sha256:b23e9a8b6471551a073327bac2f045d6ad296bb593b7157cc944fc4b4e8a5a6e
  linux_reaper_extension_name: reaper_helgobox-linux-x86_64.so
  linux_reaper_extension_checksum: sha256:bd2e44616f3ffd64a3c0f349b4276e17abf214012486a5f49277c632d40f068f
  windows_vst_name: helgobox-windows-x86_64.dll
  windows_vst_checksum: sha256:54b6a207e66da17fec8c10675fb6df62047f0ebd77255c432391c5e906c76ed7
  windows_reaper_extension_name: reaper_helgobox-windows-x86_64.dll
  windows_reaper_extension_checksum: sha256:cac64a684321737e3baa73b297faf179a29588f1d9bdf9e8ce7f7cad021c8e79

arch_yabridge_version: 5.1.1

wwine_prefix_aliases:
  musicproduction:
    path: "{{ arch_musicproduction_wine_prefix }}"
    architecture: win64
    wine_profile: system
  reaper:
    path: "{{ arch_reaper_wine_setup.wine_prefix }}"
    architecture: "{{ arch_reaper_wine_setup.architecture | default('win64') }}"
    sandbox_profile: "{{ ansible_facts.env.HOME }}/.config/firejail/wine-reaper.local"
    sandbox_check_profile: "{{ ansible_facts.env.HOME }}/.local/share/wwine/firejail-profiles/wine-reaper.local"
    sandbox_name: wwine-reaper
    wine_profile: system
  musicplugins:
    path: "{{ arch_music_plugins_wine_prefix }}"
    architecture: win64
    sandbox_profile: "{{ ansible_facts.env.HOME }}/.config/firejail/wine-reaper.local"
    sandbox_check_profile: "{{ ansible_facts.env.HOME }}/.local/share/wwine/firejail-profiles/wine-reaper.local"
    sandbox_name: wwine-reaper
    wine_profile: system
  synthv:
    path: "{{ arch_synthv_wine_prefix }}"
    architecture: win64

arch_reaper_wine_prefix: "{{ ansible_facts.env.HOME }}/data/.wine-win64-windows-reaper"
arch_reaper_wine_drive_c: "{{ arch_reaper_wine_prefix }}/drive_c"
arch_music_plugins_wine_prefix: "{{ ansible_facts.env.HOME }}/data/.wine-win64-copy-reaper"
arch_music_plugins_wine_drive_c: "{{ arch_music_plugins_wine_prefix }}/drive_c"
arch_synthv_wine_prefix: "{{ ansible_facts.env.HOME }}/data/.wine-win64-synthv2"
arch_musicproduction_wine_prefix: "{{ ansible_facts.env.HOME }}/data/.wine-win64-musicproduction"

arch_reaper_wine_setup:
  version: "777"
  backup_path: ~/data/Downloads/music-production
  wine_prefix: "{{ arch_reaper_wine_prefix }}"
  architecture: win64 # wow64 will fail for some plugins

arch_audiogridder_wine_setup:
  version: 1.1.1
  version_slug: "1_1_1"
  plugin_version: 1.1.1
  plugin_version_slug: "1_1_1"
  backup_path: ~/data/Downloads/music-production
  config_path: "{{ arch_music_plugins_wine_prefix }}/drive_c/users/{{ ansible_facts.env.USER }}/AppData/Roaming/AudioGridder"
  wine_prefix: "{{ arch_music_plugins_wine_prefix }}"
