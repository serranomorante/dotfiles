gui:
  scrollHeight: 8
  nerdFontsVersion: "3"
  expandFocusedSidePanel: true
  expandedSidePanelWeight: 5
  skipRewordInEditorWarning: true
  showDivergenceFromBaseBranch: "arrowAndNumber"
  commitAuthorLongLength: 2
  filterMode: "fuzzy"
  # setting next option to false helps with redraw issues inside neovim builtin terminal
  showBottomLine: false
  # based on: https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md#default
keybinding:
  universal:
    quit: <disabled>
git:
  autoForwardBranches: none
  branchLogCmd: "git log --graph --color=always --abbrev-commit --decorate --date=relative --pretty=medium --oneline {{branchName}} --"
  autoStageResolvedConflicts: false
  autoFetch: false
  diffRenderers:
    # Delta is provided by Git's diff.external config.
    - type: extDiff
    - command: difft --color=always --override="dotfiles-stow:bash"
      type: extDiff
os:
  edit: 'open_in_nvim lazygit_edit "$(printf %q {{filename}})"'
  editAtLine: 'open_in_nvim lazygit_edit_at_line "$(printf %q {{filename}})" "{{line}}"'
  editAtLineAndWait: 'open_in_nvim lazygit_edit_at_line_and_wait "$(printf %q {{filename}})" "{{line}}"'
  editInTerminal: false
  open: 'open_in_nvim lazygit_open "$(printf %q {{filename}})"'
  openDirInEditor: 'open_in_nvim lazygit_open_dir_in_editor "{{dir}}"'
refresher:
  refreshInterval: 1
promptToReturnFromSubprocess: false
notARepository: 'quit'
customCommands:
  - key: "<c-r>"
    description: "Custom: Generate local dependency update branch"
    context: "global"
    command: "dotfiles-renovate-apply"
    loadingText: "Generating local dependency update branch"
    output: terminal
  - key: "q"
    description: "Custom: Hide the kitty quick-access-terminal panel"
    context: "global"
    command: "kitty-lazygit-quick-access"
    output: none
  - key: "D"
    description: "Custom: Compare selected branch against checked out branch"
    context: "localBranches"
    command: 'open_in_nvim lazygit_compare_branch "{{.SelectedLocalBranch.Name}}"'
    # From commits, search the whole history for an expression in a file (case-sensitive)
  - key: '<c-a>'
    description: 'Custom: Search the whole history (from a ref and down) for an expression in a file'
    command: "git checkout {{index .PromptResponses 3}}"
    context: 'commits,subCommits'
    prompts:
      - type: 'input'
        title: 'Search word:'
      - type: 'input'
        title: 'File/Subtree:'
      - type: 'input'
        title: 'Ref:'
        initialValue: "{{index .CheckedOutBranch.Name }}"
      - type: 'menuFromCommand'
        title: 'Commits:'
        command: "git log --oneline {{index .PromptResponses 2}} -S'{{index .PromptResponses 0}}' --all -- {{index .PromptResponses 1}}"
        filter: '(?P<commit_id>[0-9a-zA-Z]*) *(?P<commit_msg>.*)'
        valueFormat: '{{ .commit_id }}'
        labelFormat: '{{ .commit_id | green | bold }} - {{ .commit_msg | yellow }}'
        # From commits, add empty commit
  - key: 'E'
    description: 'Custom: Add empty commit'
    context: 'commits,files'
    command: 'git commit --allow-empty -m "empty commit"'
    loadingText: 'Committing empty commit...'
    # From files, open mergetool (DiffviewOpen)
  - key: "M"
    description: 'Custom: Open mergetool'
    command: 'open_in_nvim lazygit_open_merge_tool "$(printf %q {{.SelectedFile.Name}})"'
    context: "files"
    loadingText: "loading DiffviewOpen"
    output: terminal
    # From commit files, open mergetool (DiffviewOpen)
  - key: "M"
    description: 'Custom: Open mergetool'
    command: 'open_in_nvim lazygit_open_merge_tool "$(printf %q {{.SelectedCommitFile.Name}})"'
    context: "commitFiles"
    loadingText: "loading DiffviewOpen"
    output: terminal
    # From files, open difftool (DiffviewOpen)
  - key: "<c-t>"
    description: 'Custom: Open difftool'
    command: 'open_in_nvim lazygit_open_difftool "$(printf %q {{.SelectedFile.Name}})"'
    context: "files"
    loadingText: "loading DiffviewOpen"
    output: terminal
    # From commit files, open difftool (DiffviewOpen)
  - key: "<c-t>"
    description: 'Custom: Open difftool'
    command: 'open_in_nvim lazygit_open_difftool "$(printf %q {{.SelectedCommitFile.Name}})"'
    context: "commitFiles"
    loadingText: "loading DiffviewOpen"
    output: terminal
    # From commits, push a specific commit (and any preceding)
  - key: 'P'
    description: 'Custom: Force push a specific commit (and any preceding)'
    command: "git push --force {{.SelectedRemote.Name}} {{.SelectedCommit.Sha}}:{{.SelectedLocalBranch.Name}}"
    context: "commits"
    loadingText: "Pushing commit..."
    prompts:
      - type: "confirm"
        key: "Confirm"
        title: "Force push specific commit"
        body: "Are you sure you want to force push?"
    output: log
    # From commits, open as a PR review
  - key: 'D'
    description: 'Custom: Diff commit against parent commit'
    command: 'open_in_nvim lazygit_diff_against_parent "{{.SelectedCommit.Sha}}"'
    context: "commits,subCommits"
    # From remotes, fetch a remote branch as a new local branch
  - key: '<c-f>'
    description: 'Custom: fetch a remote branch as a new local branch'
    command: "git fetch {{index .SelectedRemote.Name }} {{index .PromptResponses 0}}:{{index .PromptResponses 1}}"
    context: 'remotes'
    prompts:
      - type: 'input'
        title: 'Remote Branch Name'
        initialValue: ''
      - type: 'input'
        title: 'New Local Branch Name'
        initialValue: ''
    loadingText: 'fetching branch'
    # From commitFiles, compare (difftool) with local copy
  - key: 'f'
    description: 'Custom: Compare (difftool) with local copy'
    command: 'open_in_nvim lazygit_diff_with_local_copy "$(printf %q {{.SelectedCommitFile.Name}})" "{{.SelectedCommit.Sha}}"'
    context: 'commitFiles'
    # From commits, reset author AND committer of the selected commit to the
    # gitconfig global user, so GitHub shows a single author. The native "Reset
    # author" uses the repo-resolved identity, which may keep the old one when a
    # local/includeIf override exists. Uses --reset-author directly for HEAD and
    # an interactive rebase (edit + amend + continue) for any other commit.
  - key: 'U'
    description: 'Custom: Reset author/committer of selected commit to gitconfig user'
    context: 'commits'
    command: 'sha="{{.SelectedCommit.Sha}}"; name="$(git config --global user.name)"; email="$(git config --global user.email)"; if [ "$(git rev-parse HEAD)" = "$sha" ]; then git -c user.name="$name" -c user.email="$email" commit --allow-empty --allow-empty-message --only --no-edit --amend --reset-author; else short="$(git rev-parse --short "$sha")"; if git rev-parse -q --verify "$sha^" >/dev/null 2>&1; then base="$sha^"; else base="--root"; fi; GIT_SEQUENCE_EDITOR="sed -i \"s/^pick ${short}/edit ${short}/\" \"\$1\"" git rebase -i "$base"; git -c user.name="$name" -c user.email="$email" commit --allow-empty --allow-empty-message --only --no-edit --amend --reset-author; GIT_EDITOR=true git rebase --continue; fi'
    loadingText: 'Resetting author/committer...'
    prompts:
      - type: "confirm"
        key: "Confirm"
        title: "Reset author/committer"
        body: "Reset author and committer of the selected commit to your gitconfig global user?"
    after:
      checkForConflicts: true
    output: log
