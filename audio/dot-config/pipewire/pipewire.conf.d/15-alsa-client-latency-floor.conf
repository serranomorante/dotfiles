# Keep ALSA compatibility clients from dragging the graph quantum down.
#
# Every node driven by the same driver shares one quantum, and PipeWire resolves
# it as the minimum latency any follower asks for, rounded down to a power of
# two. pipewire-alsa passes an application's requested ALSA period straight
# through as node.latency, so an ordinary browser asking for 10 ms periods
# (480/48000) pulls the entire graph to 256 frames for regular desktop use. That
# is a DAW buffer size: it raises CPU wakeups and xruns on the Focusrite for no
# benefit, and it applies to every other stream sharing the driver.
#
# clock.quantum does not prevent this - it is only "the quantum used when no
# client specifies one" - and clock.min-quantum was measured not to clamp an
# explicit node.latency request. Rewriting the request itself does work: with
# this rule a client asking 128/48000 gets node.latency = 1024/48000.
#
# Scope is deliberately narrow. It matches only pipewire-alsa client streams
# (alsa_playback.* / alsa_capture.*), never the ALSA device nodes themselves
# (alsa_output.* / alsa_input.*), and never the JACK path. Music production
# keeps its low latency: REAPER, Ardour and AudioGridder reach PipeWire through
# pipewire-jack with PIPEWIRE_LATENCY from the launchers, so they still pull the
# graph down to the buffer selected with `audio-latency set`, and it returns to
# 1024 when they exit. pipewire-pulse clients already request large buffers
# (8192/48000 observed) and never drove the quantum down.
node.rules = [
  {
    matches = [
      { node.name = "~alsa_playback\\..*" }
      { node.name = "~alsa_capture\\..*" }
    ]
    actions = {
      update-props = {
        node.latency = 1024/48000
      }
    }
  }
]
