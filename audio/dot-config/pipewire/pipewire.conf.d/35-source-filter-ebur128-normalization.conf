# EBU R128 loudness normalization sink for Brave.
# Auto-connect-ports.lua sends only Brave here; its output stream
# (source_filter.ebur128_normalize) is routed back into the multimedia logical
# sink, so set-output-route still controls which physical device Brave uses.
# The chain runs one stereo instance of the repo-built agc_ceiling LADSPA
# plugin (/usr/lib/ladspa/libdotfiles-agc-ceiling.so, compiled by the audio
# tools role): it tracks EBU momentary loudness across both channels and levels
# aggressively toward Target LUFS. Quiet classical passages get a strong boost,
# sudden fortissimos duck within ~0.4 s (fast Attack, slow Release), and the
# boost fades out over the Knee below Floor LUFS so base mic/room noise is never
# lifted into audibility - with these values nothing below -72 LUFS (Floor minus
# Knee) is boosted at all. This collapses the wide dynamic range of classical
# music into one even level. A final sample-peak limiter hard-caps every output
# sample at Ceiling (dB) so a quiet passage riding a big boost cannot overshoot
# when a fortissimo hits before the momentary window reacts. One stereo instance
# rather than two mono ones keeps a single shared gain and limiter across L/R,
# which preserves the stereo image. Only Brave is routed here; Chromium,
# Firefox, and other applications are untouched.
context.modules = [
  {
    name = libpipewire-module-filter-chain
    args = {
      node.description = "[source filter] EBU R128 normalizer"
      media.name = "[source filter] EBU R128 normalizer"
      filter.graph = {
        nodes = [
          {
            name  = agc
            type  = ladspa
            plugin = /usr/lib/ladspa/libdotfiles-agc-ceiling.so
            label = agc_ceiling
            control = {
              "Target LUFS" = -28.0
              "Floor LUFS" = -58.0
              "Knee (dB)" = 14.0
              "Max Gain (dB)" = 34.0
              "Attack (ms)" = 20.0
              "Release (ms)" = 500.0
              "Ceiling (dB)" = -1.0
              "Limiter Release (ms)" = 200.0
            }
          }
        ]
        inputs  = [ "agc:In L" "agc:In R" ]
        outputs = [ "agc:Out L" "agc:Out R" ]
      }
      capture.props = {
        node.name        = "capture.source_filter.ebur128_normalize"
        node.description = "[sink node] EBU R128 normalizer"
        media.class      = Audio/Sink
        audio.position   = [ FL FR ]
        audio.rate       = 48000
      }
      playback.props = {
        node.name      = "source_filter.ebur128_normalize"
        audio.position = [ FL FR ]
        audio.rate     = 48000
        node.passive   = true
      }
    }
    # Without these flags a missing or incompatible agc_ceiling.so does not just
    # disable this chain: filter-chain is a mandatory module, so PipeWire fails
    # to create its context and the whole daemon exits. That happened on
    # 2026-09-03, when this fragment was deployed ahead of the compiled plugin
    # and left the workstation with no audio stack until the plugin was built.
    flags = [ ifexists nofail ]
  }
]
