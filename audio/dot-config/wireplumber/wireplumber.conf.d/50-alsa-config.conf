monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.usb-Focusrite_Scarlett_4i4_4th_Gen_.*"
      }
    ]
    actions = {
      update-props = {
        device.profile = "pro-audio"
      }
    }
  },
  {
    matches = [
      {
        node.name = "~alsa_input.usb-Focusrite_Scarlett_4i4_4th_Gen_.*"
      }
      {
        node.name = "~alsa_output.usb-Focusrite_Scarlett_4i4_4th_Gen_.*"
      }
    ]
    actions = {
      update-props = {
        node.pause-on-idle = true
      }
    }
  },
  {
    # Prefer the playback node as the graph clock driver over the capture node.
    # USB capture timing is device-driven and jittery; when it clocks the graph
    # it wakes REAPER late and causes xruns. The playback side is host-driven and
    # more stable, so raise it above the capture node's default driver priority.
    matches = [
      {
        node.name = "~alsa_output.usb-Focusrite_Scarlett_4i4_4th_Gen_.*"
      }
    ]
    actions = {
      update-props = {
        priority.driver = 2700
      }
    }
  },
  {
    matches = [
      {
        node.name = "~alsa_input.usb-Focusrite_Scarlett_4i4_4th_Gen_.*-00.pro-input-0"
      }
    ]
    actions = {
      update-props = {
        node.name = "alsa_input.usb-Focusrite_Scarlett_4i4_4th_Gen.pro-input-0"
      }
    }
  }
]
